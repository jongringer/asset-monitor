<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>probe k200 v3</title>
<style>body{background:#111;color:#eee;font:12px/1.5 monospace;padding:8px}#o{white-space:pre-wrap}</style>
</head><body><div id="o">start</div>
<script>
var out=[];
function log(s){ out.push(s); document.getElementById("o").textContent=out.join("\n"); }
function getText(url, ms, headers){
  var ctl=new AbortController(); var t=setTimeout(function(){ctl.abort();}, ms);
  var opt={signal:ctl.signal, cache:"no-store", mode:"cors", credentials:"omit"};
  if(headers) opt.headers=headers;
  return fetch(url,opt).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
    .then(function(t){ clearTimeout(t); return t; }, function(e){ clearTimeout(t); throw e; });
}
function jsonLoose(txt){
  if(!txt) throw new Error("empty");
  var i=txt.indexOf("{"), j=txt.lastIndexOf("}");
  if(i<0||j<i) throw new Error("not json");
  return JSON.parse(txt.slice(i,j+1));
}
function dstr(x){ var m=x.getMonth()+1, dd=x.getDate(); return x.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd; }
var HDR={"domain-id":"www","accept":"application/json"};

function daily(){
  var now=new Date(); var from=new Date(now.getTime()-10*86400000);
  var u="https://api.investing.com/api/financialdata/historical/8987?start-date="+dstr(from)+"&end-date="+dstr(now)+"&time-frame=Daily&add-missing-rows=false&_="+Date.now();
  getText(u, 12000, HDR).then(function(t){
    var rows=jsonLoose(t).data||[];
    log("D rows="+rows.length);
    rows.slice(0,4).forEach(function(r){
      log("D "+r.rowDate+" o="+r.last_open+" h="+r.last_max+" l="+r.last_min+" c="+r.last_close+" chg="+r.change_precent+" vol="+r.volume);
    });
  }).catch(function(e){ log("D fail "+(e&&e.message||e)); });
}
function quotes(){
  var urls=[
    "https://api.investing.com/api/financialdata/quotes/pairIds?pairIds=8987",
    "https://api.investing.com/api/financialdata/quotes?pairIds=8987",
    "https://api.investing.com/api/financialdata/8987/quotes/pairIds?",
    "https://api.investing.com/api/financialdata/chart/sparkline/8987?start-date="+dstr(new Date(Date.now()-7*86400000))+"&end-date="+dstr(new Date())+"&time-frame=Daily"
  ];
  urls.forEach(function(u){
    getText(u+(u.indexOf("?")<0?"?":"&")+"_="+Date.now(), 12000, HDR).then(function(t){
      var j=jsonLoose(t);
      log("R ok "+u.slice(42,110)+" :: "+JSON.stringify(j).slice(0,320));
    }).catch(function(e){ log("R fail "+u.slice(42,100)+" "+((e&&e.message)||e)); });
  });
}
log("clock "+new Date().toISOString());
daily(); quotes();
</script></body></html>
