<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>390×844 검증 프레임 (임시)</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#15181d;color:#dfe6ee;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Noto Sans KR",sans-serif}
  body{display:flex;gap:16px;align-items:center;justify-content:center;padding:12px}
  iframe{width:390px;height:844px;border:0;display:block;background:#0C1014;border-radius:10px;overflow:hidden;flex:0 0 auto}
  #panel{width:330px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
  h1{font-size:13px;margin:0 0 4px;color:#9fb0c2;font-weight:700}
  button{all:unset;cursor:pointer;padding:7px 10px;border-radius:8px;background:#242c36;border:1px solid #333d49;font-size:12px;font-weight:700}
  button:active{background:#2f3945}
  pre{margin:0;padding:10px;border-radius:8px;background:#0e1216;border:1px solid #232b34;white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.45;min-height:120px}
</style>
</head>
<body>
<iframe id="f" src="./index.html?v=rd1" width="390" height="844" title="자산 변동률 390x844"></iframe>
<div id="panel">
  <h1>터치 드래그 검증 (합성 터치 이벤트)</h1>
  <button id="t1">T1 · 나스닥100 롱프레스 후 4칸 아래로 끌기</button>
  <button id="t2">T2 · 프레임 새로고침 후 순서 확인</button>
  <button id="t3">T3 · 롱프레스+끌기 상태 유지(스크린샷용)</button>
  <button id="t4">T4 · 끌고 있던 행 놓기</button>
  <button id="t5">T5 · 앱의 '순서 초기화' 누르기</button>
  <button id="t6">T6 · 코스피200 야간선물을 맨 위로</button>
  <button id="t7">T7 · 새 자산 합류(저장 순서에 금 없음)</button>
  <button id="t8">T8 · 저장값 지우고 새로고침(기본 순서)</button>
  <pre id="out">ready</pre>
</div>
<script>
(function(){
  var f = document.getElementById('f');
  var out = document.getElementById('out');
  function doc(){ return f.contentDocument; }
  function win(){ return f.contentWindow; }
  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function log(o){
    out.textContent = (typeof o === 'string') ? o : JSON.stringify(o, null, 1);
  }
  function order(){ return Array.prototype.map.call(doc().querySelectorAll('#list > .row'), function(r){ return r.dataset.id; }); }
  function saved(){ try{ return doc().defaultView.localStorage.getItem('assetMonitor.order.v1'); }catch(e){ return 'ERR ' + e.message; } }
  function report(extra){
    var o = { order: order(), saved: saved(),
              chip: (function(){ var b = doc().getElementById('ordreset'); return b ? b.className : null; })() };
    for(var k in extra) o[k] = extra[k];
    log(o);
  }

  /* 부모 문서에서 iframe 안 요소로 합성 터치 이벤트를 보낸다(같은 출처). */
  function touch(el, type, x, y){
    var T = win().Touch, E = win().TouchEvent;
    var t = new T({identifier: 7, target: el, clientX: x, clientY: y, pageX: x, pageY: y, screenX: x, screenY: y});
    var live = (type === 'touchend' || type === 'touchcancel') ? [] : [t];
    el.dispatchEvent(new E(type, {bubbles: true, cancelable: true, touches: live, targetTouches: live, changedTouches: [t]}));
  }

  var held = null;   /* T3에서 붙잡아 둔 상태 */

  async function drag(id, dyPx, holdMs, release){
    var el = doc().getElementById('row-' + id);
    if(!el) throw new Error('no row ' + id);
    var r = el.getBoundingClientRect();
    var x = r.left + 30, y0 = r.top + r.height * 0.5;
    touch(el, 'touchstart', x, y0);
    await sleep(holdMs || 320);                 /* 250ms 롱프레스 타이머가 지나도록 */
    var steps = 10;
    for(var i = 1; i <= steps; i++){
      touch(el, 'touchmove', x, y0 + dyPx * i / steps);
      await sleep(16);
    }
    if(release !== false){ touch(el, 'touchend', x, y0 + dyPx); await sleep(320); }
    return {el: el, x: x, y: y0 + dyPx};
  }

  function done(extra){ return new Promise(function(r){ setTimeout(function(){ report(extra); r(); }, 60); }); }

  document.getElementById('t1').addEventListener('click', async function(){
    try{
      var before = order();
      var res = await drag('ndx', 4 * 35, 320, true);
      report({before: before, moved: 'ndx', targetRowTop: +(res.el.getBoundingClientRect().top).toFixed(1)});
    }catch(e){ log('ERR ' + e.message); }
  });

  document.getElementById('t2').addEventListener('click', function(){
    out.textContent = 'reloading…';
    f.contentWindow.location.reload();
    setTimeout(function(){ report({reloaded: true}); }, 1200);
  });

  document.getElementById('t3').addEventListener('click', async function(){
    try{
      var res = await drag('kospi', 3 * 35, 400, false);
      held = res;
      report({holding: 'kospi', dy: 3 * 35});
    }catch(e){ log('ERR ' + e.message); }
  });

  document.getElementById('t4').addEventListener('click', async function(){
    if(!held) return log('no held drag');
    touch(held.el, 'touchend', held.x, held.y);
    held = null;
    await sleep(320);
    report({released: true});
  });

  document.getElementById('t5').addEventListener('click', async function(){
    var b = doc().getElementById('ordreset');
    if(!b) return log('no reset button');
    b.click();
    await sleep(300);
    report({clickedReset: true});
  });

  document.getElementById('t6').addEventListener('click', async function(){
    try{
      await drag('k200', -10 * 35, 320, true);
      report({'moved': 'k200 → top'});
    }catch(e){ log('ERR ' + e.message); }
  });

  document.getElementById('t7').addEventListener('click', function(){
    /* 저장 순서에서 금(gold)만 빼고 나머지는 현재 순서 그대로 저장 → 새로고침 시 skhy와 wti 사이로 합류해야 한다 */
    var cur = order(), i = cur.indexOf('gold');
    if(i >= 0) cur.splice(i, 1);
    doc().defaultView.localStorage.setItem('assetMonitor.order.v1', JSON.stringify(cur));
    out.textContent = 'saved without gold, reloading…';
    f.contentWindow.location.reload();
    setTimeout(function(){
      var o = order(), gi = o.indexOf('gold');
      report({withoutGoldBefore: cur.join(','), goldIndex: gi, prev: o[gi-1], next: o[gi+1],
              mergedBetweenSkhyAndWti: (o[gi-1] === 'skhy' && o[gi+1] === 'wti')});
    }, 1200);
  });

  document.getElementById('t8').addEventListener('click', function(){
    doc().defaultView.localStorage.removeItem('assetMonitor.order.v1');
    out.textContent = 'storage cleared, reloading…';
    f.contentWindow.location.reload();
    setTimeout(function(){ report({resetToBase: true}); }, 1200);
  });

  f.addEventListener('load', function(){ out.textContent = 'frame loaded · ' + order().length + ' rows'; });
})();
</script>
</body>
</html>
