<!DOCTYPE html>

<head>

<style>
  :root{
    --line:rgba(255,255,255,.075);
    --card:#14171F;
    --dim:#98A0AE;
    --dim2:#6E7686;
    --ice:#8ED0F0;
    --hot:#FF6E7C;
    --down:var(--ice);
    --up:var(--hot);
    --gold:#EFC05A;
    --ok:#2FD08E;
    --warn:#F0B429;
    --bad:#FF5B6B;
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#08090C;color:#EDF0F5;font-family:var(--font)}
  body{display:flex;justify-content:center;align-items:stretch;overflow:hidden}

  /* 9:16 세로 프레임 — 모바일은 화면 전체, 데스크톱은 중앙 세로 프레임 */
  #app{
    position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;font-size:16px;
    background:
      radial-gradient(125% 52% at 50% -14%, #1E222C 0%, rgba(11,13,17,0) 62%),
      linear-gradient(180deg,#101318 0%, #0B0D11 58%, #08090C 100%);
    padding:calc(env(safe-area-inset-top,0px) + .42em) .55em calc(env(safe-area-inset-bottom,0px) + .34em);
    box-shadow:0 0 70px rgba(0,0,0,.85);
  }
  @media (min-aspect-ratio: 9/16) and (min-width:480px){
    body{align-items:center;background:radial-gradient(85% 65% at 50% 40%,#111419 0%,#050608 100%)}
    #app{height:min(100dvh, calc(430px * 16 / 9));border-radius:20px;margin:auto;
      border:1px solid rgba(255,255,255,.07)}
  }

  /* ── 헤더 ── */
  header{flex:0 0 auto;padding:0 .18em}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:.5em}
  .ttl{font-size:.64em;font-weight:700;letter-spacing:.17em;color:var(--dim2);text-transform:uppercase}
  .clock{font-size:.84em;font-weight:800;font-variant-numeric:tabular-nums;color:#E4E8EF}
  .clock .tz{font-size:.68em;color:var(--dim2);font-weight:700;margin-left:.3em;letter-spacing:.1em}
  .sub{margin:.1em 0 .02em;display:flex;align-items:center;gap:.4em}
  .sub .grad{
    font-size:1.34em;font-weight:800;letter-spacing:-.024em;line-height:1.14;
    background:linear-gradient(92deg,#FFFFFF 0%,#DFE4EC 52%,#9AA4B8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .live{flex:0 0 auto;font-size:.52em;font-weight:800;letter-spacing:.08em;color:#06110d;
    background:var(--ok);border-radius:99px;padding:.22em .58em;line-height:1.4}
  .live.off{background:#3A4150;color:#A6ADBA}
  .bar{position:relative;height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.38em}
  .bar > i{position:absolute;inset:0;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#59606E,#D6DCE6);transform-origin:left center;will-change:transform}
  .barmeta{display:flex;justify-content:space-between;align-items:center;margin-top:.2em;font-size:.57em;color:var(--dim2);font-weight:700;letter-spacing:.03em}
  .barmeta .btn{all:unset;cursor:pointer;color:#E2E7EF;font-size:1.02em;font-weight:800;letter-spacing:.05em;
    padding:.3em .74em;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.055)}
  .barmeta .btn:active{background:rgba(255,255,255,.14)}

  /* ── 자산 리스트 (14개) ── */
  main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;margin-top:.36em;gap:.16em}
  .row{
    position:relative;flex:1 1 0;min-height:0;
    display:flex;flex-direction:column;justify-content:center;gap:.06em;
    padding:.14em .52em .2em .6em;border-radius:.5em;
    background:linear-gradient(100deg,#191D25 0%,#12151B 100%);
    border:1px solid var(--line);overflow:hidden;transition:opacity .4s ease;
  }
  .row::before{content:"";position:absolute;left:0;top:.32em;bottom:.32em;width:3px;border-radius:99px;
    background:var(--acc,#56A8F0);opacity:.95}
  .row.stale{opacity:.42}

  .top{display:flex;align-items:baseline;gap:.4em;min-width:0}
  .nm{flex:0 1 auto;font-size:.76em;font-weight:700;color:#C6CCD8;letter-spacing:-.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .px{margin-left:auto;flex:0 0 auto;font-size:1.16em;font-weight:800;color:#fff;
    font-variant-numeric:tabular-nums;letter-spacing:-.018em;line-height:1.08}
  .pct{flex:0 0 auto;min-width:3.35em;margin-left:.08em;text-align:right;font-size:1.38em;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1.02;color:var(--down)}
  .pct.up{color:var(--up)}
  .pct.flat{color:#A6AEBC}

  .bot{display:flex;align-items:baseline;justify-content:space-between;gap:.5em;min-width:0}
  .ath{font-size:.58em;font-weight:700;color:var(--dim2);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ath b{color:#9AA4B4;font-weight:800}
  .dc{flex:0 0 auto;font-size:.58em;font-weight:700;color:var(--dim2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dc.up{color:#FF98A2}
  .dc.down{color:#8FBED6}
  .row.newhigh .ath b{color:var(--gold)}

  /* ── 자산명 옆 고점 대비 추이 미니 그래프(3년 주간) ── */
  .spk{flex:0 0 auto;width:56px;height:20px;display:block;align-self:center;
    margin:0 0 0 .22em;overflow:visible;pointer-events:none}
  .spk svg{display:block;width:100%;height:100%}

  .gauge{position:absolute;left:.6em;right:.52em;bottom:.09em;height:2px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
  .gauge > i{display:block;height:100%;width:0%;border-radius:99px;opacity:.85;
    background:linear-gradient(90deg,var(--acc,#56A8F0),var(--acc2,#9FD0FF));transition:width .45s ease}

  /* ── 푸터 ── */
  footer{flex:0 0 auto;padding:.4em .18em 0;display:flex;flex-direction:column;gap:.14em}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:.5em;font-size:.6em;color:var(--dim2);font-weight:700}
  .frow > span{min-width:0}
  .frow .pin{display:inline-block;width:.58em;height:.58em;border-radius:99px;background:var(--bad);margin-right:.4em;vertical-align:.04em;box-shadow:0 0 0 .18em rgba(255,91,107,.13)}
  .frow.ok .pin{background:var(--ok);box-shadow:0 0 0 .18em rgba(37,208,125,.13)}
  .frow.warn .pin{background:var(--warn);box-shadow:0 0 0 .18em rgba(240,180,41,.13)}
  .frow .src{font-variant-numeric:tabular-nums;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mkt{font-size:.57em;color:#5A6070;font-weight:700;letter-spacing:.02em;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="hrow">
      <div class="ttl">주요 자산 현황 · 14</div>
      <div class="clock"><span id="clock">--:--:--</span><span class="tz">KST</span></div>
    </div>
    <div class="sub"><span class="grad">3년내 최고점 대비 변동률</span><span class="live" id="live">LIVE</span></div>
    <div class="bar"><i id="prog"></i></div>
    <div class="barmeta">
      <span id="cd">10초마다 자동 갱신</span>
      <button class="btn" id="refresh" type="button">새로고침</button>
    </div>
  </header>

  <main id="list"></main>

  <footer>
    <div class="frow" id="status">
      <span><span class="pin"></span><span id="stxt">불러오는 중…</span></span>
      <span class="src" id="src">—</span>
    </div>
    <div class="mkt"><b id="mktUS">미국 —</b><b id="mktKR">국내 —</b></div>
  </footer>

</div>

<script>
(function(){
  "use strict";

  /* ───────── 자산 정의 · 3년내(2024~2026) 최고점 기준(고정값) ───────── */
  var ASSETS = [
    {id:"sp500", name:"S&P 500",         yahoo:"^GSPC", grp:"us",   ath:7844.52,  athDate:"26.10 장중",    dec:2, cur:"$", chgLabel:"전일"},
    {id:"es",    name:"US500 선물",      yahoo:"ES=F",  grp:"us",   ath:7897.50,  athDate:"26.10.05 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"ndx",   name:"나스닥 100",       yahoo:"^NDX",  grp:"us",   ath:31361.37, athDate:"26.10.06 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"dji",   name:"다우존스",         yahoo:"^DJI",  grp:"us",   ath:54744.33, athDate:"26.08.05 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"rut",   name:"러셀 2000",        yahoo:"^RUT",  grp:"us",   ath:3069.71,  athDate:"26.08.14 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"sox",   name:"필라델피아 반도체", yahoo:"^SOX",  grp:"semi", ath:14655.29, athDate:"26.06.22 장중", dec:2, cur:"",  chgLabel:"전일"},
    {id:"kospi", name:"코스피",           yahoo:"^KS11", grp:"kr",   ath:9385.59,  athDate:"26.06.19 장중", dec:2, cur:"",  chgLabel:"전일"},
    {id:"kosdaq",name:"코스닥",           yahoo:"^KQ11", grp:"kr",   ath:1226.18,  athDate:"26.04.27 종가", dec:2, cur:"",  chgLabel:"전일"},
    {id:"skhy",  name:"SK하이닉스 ADR",   yahoo:"SKHY",  grp:"semi", ath:199.87,   athDate:"26.09.09 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"gold",  name:"금 (COMEX)",       yahoo:"GC=F",  grp:"cmdt", ath:5595.46,  athDate:"26.01 장중",    dec:2, cur:"$", chgLabel:"전일"},
    {id:"wti",   name:"WTI 유",           yahoo:"CL=F",  grp:"cmdt", ath:119.48,   athDate:"26.03.09 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"btc",   name:"비트코인",         yahoo:null,    grp:"coin", histSym:"BTC-USD", ath:126198, athDate:"25.10.06 장중", dec:0, cur:"$", chgLabel:"24h"},
    {id:"eth",   name:"이더리움",         yahoo:null,    grp:"coin", histSym:"ETH-USD", ath:4953.73, athDate:"25.08.24 장중", dec:2, cur:"$", chgLabel:"24h"},
    {id:"krw",   name:"원/달러 환율",     yahoo:"KRW=X", grp:"fx",   ath:1587.70,  athDate:"26.07.09 장중", dec:2, cur:"",  chgLabel:"전일"}
  ];
  var BY = {}, ORDER = [];
  ASSETS.forEach(function(a){ BY[a.id]=a; ORDER.push(a.id); });

  /* 자산군 포인트 컬러 (c: 기본, l: 밝은 톤) */
  var GRP = {
    us:   {c:"#56A8F0", l:"#A8D6FF"},   // 미국 지수 — 스카이블루
    semi: {c:"#A78BFA", l:"#D6C8FF"},   // 반도체 — 바이올렛
    kr:   {c:"#37D39B", l:"#9BF0D2"},   // 국내 지수 — 에메랄드
    cmdt: {c:"#EFC05A", l:"#FFE1A3"},   // 원자재 — 골드
    coin: {c:"#FF8A5C", l:"#FFC1A3"},   // 가상자산 — 오렌지
    fx:   {c:"#4FD1C5", l:"#A9EFE8"}    // 환율 — 티얼
  };
  function grpOf(a){ return GRP[a.grp] || GRP.us; }

  var YSYMS = ASSETS.filter(function(a){return a.yahoo;}).map(function(a){return a.yahoo;});
  var CYCLE = 10000;       // 10초마다 자동 갱신
  var STALE_MS = 120000;   // 2분 넘게 갱신 안 된 값은 흐리게

  var state = {}, busy = false;
  var nextAt = Date.now() + CYCLE;
  var srcTag = {coin:null};

  /* 주소 뒤에 ?debug=1 을 붙이면 각 데이터 경로의 시도 결과·소요시간을 하단에 표시 */
  var DBG = /[?&]debug/.test(location.search);
  var diag = [];
  function dg(s){ diag.push(s); while(diag.length>7) diag.shift(); }

  /* ───────── 유틸 ───────── */
  function $(s){ return document.querySelector(s); }
  function nf(v,d){ return (v==null||!isFinite(v)) ? "—" : Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function kstTime(d){
    return new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour12:false,
      hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d||new Date());
  }
  function tzParts(tz){
    var o={};
    new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,weekday:"short",hour:"2-digit",minute:"2-digit"})
      .formatToParts(new Date()).forEach(function(p){ o[p.type]=p.value; });
    return {wd:o.weekday, h:parseInt(o.hour,10)%24, m:parseInt(o.minute,10)};
  }
  function isUSOpen(){
    var p = tzParts("America/New_York");
    if(p.wd==="Sat"||p.wd==="Sun") return false;
    var t=p.h*60+p.m; return t>=570 && t<960;    // 09:30–16:00 ET
  }
  function isKROpen(){
    var p = tzParts("Asia/Seoul");
    if(p.wd==="Sat"||p.wd==="Sun") return false;
    var t=p.h*60+p.m; return t>=540 && t<930;    // 09:00–15:30 KST
  }
  function getText(url, ms){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, ms);
    return fetch(url, {signal:ctl.signal, cache:"no-store", mode:"cors", credentials:"omit"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(t){ clearTimeout(timer); return t; }, function(e){ clearTimeout(timer); throw e; });
  }
  function jsonLoose(txt){        // 프록시가 앞뒤에 안내문을 붙여도 JSON만 뽑아낸다
    if(!txt) throw new Error("empty");
    var i = txt.indexOf("{"), j = txt.lastIndexOf("}");
    if(i<0 || j<i) throw new Error("not json");
    return JSON.parse(txt.slice(i,j+1));
  }

  /* ───────── 지수·금·원유·환율: Yahoo (브라우저 CORS 차단 → 프록시 폴백 체인) ───────── */
  function yahooURL(){
    return "https://query1.finance.yahoo.com/v8/finance/spark?symbols=" +
      encodeURIComponent(YSYMS.join(",")) + "&range=1d&interval=1d&_=" + Date.now();
  }
  var ROUTES = [
    {n:"jina",      f:function(u){ return "https://r.jina.ai/" + u; },            ms:6000},
    {n:"codetabs",  f:function(u){ return "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u); }, ms:4000},
    {n:"allorigins",f:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }, ms:4000},
    {n:"cors.lol",  f:function(u){ return "https://api.cors.lol/?url=" + encodeURIComponent(u); }, ms:4000},
    {n:"direct",    f:function(u){ return u; }, ms:4000}
  ];
  // 두 개씩 동시에 시도하고 먼저 성공한 쪽을 쓴다 (성공한 조합을 다음에 우선 시도)
  var GROUPS = [[0,3],[1,2],[4]];
  var prefGroup = 0;

  function oneRoute(ri, target){
    var r = ROUTES[ri];
    return getText(r.f(target), r.ms).then(jsonLoose).then(function(d){ return {d:d, gi:ri, name:r.n}; });
  }
  function firstOf(list, target){
    return new Promise(function(resolve, reject){
      var left = list.length, dead = 0;
      if(!left) return reject(new Error("empty group"));
      list.forEach(function(ri){
        oneRoute(ri, target).then(resolve, function(e){
          if(DBG) dg("x"+ROUTES[ri].n+":"+((e&&e.message)||e));
          if(++dead === left) reject(e || new Error("group failed"));
        });
      });
    });
  }
  function getIndices(){
    var target = yahooURL();
    var gi = 0;
    function attempt(){
      if(gi >= GROUPS.length) return Promise.reject(new Error("all routes failed"));
      var g = GROUPS[(prefGroup + gi) % GROUPS.length];
      gi++;
      return firstOf(g, target).then(function(hit){
        var d = hit.d;
        if(!d || typeof d!=="object") throw new Error("bad payload");
        var n = 0, now = Date.now();
        ASSETS.forEach(function(a){
          if(!a.yahoo) return;
          var node = d[a.yahoo];
          if(!node) return;
          var px = (node.close && node.close.length) ? node.close[node.close.length-1] : null;
          if((px==null||!isFinite(px)) && isFinite(node.fulldayPrice)) px = node.fulldayPrice;
          if(px==null||!isFinite(px)) return;
          var chg = isFinite(node.fulldayChangePercent) ? node.fulldayChangePercent
                  : ((isFinite(node.chartPreviousClose) && node.chartPreviousClose)
                      ? (px-node.chartPreviousClose)/node.chartPreviousClose*100 : null);
          state[a.id] = {px:px, chg:chg, t:now};
          n++;
        });
        if(!n) throw new Error("no symbols");
        prefGroup = GROUPS.indexOf(g);
        if(DBG) dg("idx:"+hit.name+" n="+n);
        return n;
      }).catch(function(e){
        if(DBG) dg("idx fail:"+((e&&e.message)||e));
        return attempt();
      });
    }
    return attempt();
  }

  /* ───────── 가상자산: CoinGecko → OKX → Upbit ───────── */
  function setCoin(id, px, chg){ if(isFinite(px)) state[id] = {px:px, chg:chg, t:Date.now()}; }
  function coinGecko(){
    return getText("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true&_="+Date.now(), 5000)
      .then(function(t){
        var d = JSON.parse(t);
        if(!d || !d.bitcoin || !d.ethereum) throw new Error("bad");
        setCoin("btc", d.bitcoin.usd, d.bitcoin.usd_24h_change);
        setCoin("eth", d.ethereum.usd, d.ethereum.usd_24h_change);
        srcTag.coin = "CoinGecko"; return 2;
      });
  }
  function okx(){
    return Promise.all([["btc","BTC-USDT"],["eth","ETH-USDT"]].map(function(p){
      return getText("https://www.okx.com/api/v5/market/ticker?instId="+p[1]+"&_="+Date.now(), 5000)
        .then(function(t){
          var d = JSON.parse(t), row = d && d.data && d.data[0];
          if(!row) throw new Error("bad");
          var last = parseFloat(row.last), open = parseFloat(row.open24h);
          setCoin(p[0], last, (isFinite(open)&&open) ? (last-open)/open*100 : null);
        });
    })).then(function(){ srcTag.coin = "OKX"; return 2; });
  }
  function upbit(){
    return getText("https://api.upbit.com/v1/ticker?markets=USDT-BTC,USDT-ETH&_="+Date.now(), 5000)
      .then(function(t){
        var d = JSON.parse(t);
        if(!Array.isArray(d) || !d.length) throw new Error("bad");
        d.forEach(function(r){
          var id = (r.market.indexOf("BTC")>0) ? "btc" : "eth";
          setCoin(id, r.trade_price, (r.signed_change_rate!=null ? r.signed_change_rate*100 : null));
        });
        srcTag.coin = "Upbit"; return 2;
      });
  }
  function getCrypto(){
    var t0 = Date.now();
    return coinGecko().catch(okx).catch(upbit)
      .then(function(n){ if(DBG) dg("coin:"+(Date.now()-t0)+"ms "+(srcTag.coin||"?")); return n; },
            function(e){ if(DBG) dg("coin:"+(Date.now()-t0)+"ms fail"); throw e; });
  }

  /* ───────── 3년 주간 히스토리 → 자산명 옆 미니 스파크라인 ───────── */
  var SPK_W = 56, SPK_H = 20, SPK_PADY = 2.4;
  var HIST_KEY = "apm.hist.v3", HIST_TTL = 6*3600*1000;
  var HIST = {}, histAt = 0, SPKC = {};

  function histSym(a){ return a.histSym || a.yahoo; }

  // 14개 심볼을 한 요청으로 (12개 지수·선물·원자재·환율 + BTC-USD·ETH-USD)
  function histURL(){
    var syms = [];
    ASSETS.forEach(function(a){ var s = histSym(a); if(s) syms.push(s); });
    return "https://query1.finance.yahoo.com/v8/finance/spark?symbols=" +
      encodeURIComponent(syms.join(",")) + "&range=3y&interval=1wk&_=" + Date.now();
  }

  // 히스토리는 프록시를 한 번에 하나씩만(부하 최소화) 시도
  var HROUTES = [
    {n:"jina",       f:function(u){ return "https://r.jina.ai/" + u; }, ms:9000},
    {n:"codetabs",   f:function(u){ return "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u); }, ms:7000},
    {n:"allorigins", f:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }, ms:7000},
    {n:"cors.lol",   f:function(u){ return "https://api.cors.lol/?url=" + encodeURIComponent(u); }, ms:7000},
    {n:"direct",     f:function(u){ return u; }, ms:6000}
  ];
  function histGet(u){
    var i = 0;
    function next(){
      if(i >= HROUTES.length) return Promise.reject(new Error("all hist routes failed"));
      var r = HROUTES[i++];
      return getText(r.f(u), r.ms).then(jsonLoose).catch(function(e){
        if(DBG) dg("h:" + r.n + " x");
        return next();
      });
    }
    return next();
  }

  // 종가 → ((종가 - 3년내 최고점) / 최고점) * 100
  function histSeries(a, closes){
    var v = [];
    for(var i=0;i<closes.length;i++){
      var c = closes[i];
      if(c==null || !isFinite(c) || c<=0) continue;
      v.push(Math.round((c - a.ath) / a.ath * 10000) / 100);
    }
    return v.length >= 2 ? v : null;
  }
  function histApply(d){
    var n = 0;
    ASSETS.forEach(function(a){
      var node = d && d[histSym(a)];
      if(!node) return;
      var v = histSeries(a, node.close || node.c || []);
      if(v){ HIST[a.id] = v; n++; }
    });
    return n;
  }
  function histSave(){
    try{ localStorage.setItem(HIST_KEY, JSON.stringify({t:histAt, d:HIST})); }catch(e){}
  }
  function histRestore(){
    try{
      var c = JSON.parse(localStorage.getItem(HIST_KEY) || "null");
      if(!c || !c.d) return;
      ORDER.forEach(function(id){ if(c.d[id] && c.d[id].length>1) HIST[id] = c.d[id]; });
      histAt = c.t || 0;
    }catch(e){}
  }

  function loadHist(){
    if(histAt && (Date.now() - histAt) < HIST_TTL && Object.keys(HIST).length) return;
    histGet(histURL()).then(function(d){
      var n = histApply(d);
      if(!n) throw new Error("no symbols");
      histAt = Date.now(); histSave(); redrawSparks();
      if(DBG) dg("hist " + n);
    }).catch(function(){
      if(DBG) dg("hist fail");
      loadHistOne();      // 폴백: 심볼별 chart (연속 2회 실패하면 중단)
    });
  }
  function loadHistOne(){
    var list = ASSETS.filter(function(a){ return !HIST[a.id]; });
    var i = 0, bad = 0;
    function step(){
      if(i >= list.length || bad >= 2) return;
      var a = list[i++];
      var u = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(histSym(a)) +
        "?range=3y&interval=1wk&_=" + Date.now();
      histGet(u).then(function(d){
        var r = d && d.chart && d.chart.result && d.chart.result[0];
        var q = r && r.indicators && r.indicators.quote && r.indicators.quote[0];
        var v = histSeries(a, (q && q.close) || []);
        if(!v) throw new Error("no series");
        HIST[a.id] = v; bad = 0; histAt = Date.now(); redrawSparks();
      }).catch(function(){ bad++; }).then(function(){
        if(i >= list.length || bad >= 2){ histAt = Date.now(); histSave(); }
        else setTimeout(step, 250);
      });
    }
    step();
  }

  function sparkDomain(v){
    var mn = 0, mx = 0;
    for(var i=0;i<v.length;i++){ if(v[i] < mn) mn = v[i]; if(v[i] > mx) mx = v[i]; }
    var hi = Math.max(0, mx), lo = Math.min(0, mn), span = hi - lo;
    if(span < 8){ lo = hi - 8; span = 8; }        // 변동이 작아도 노이즈가 증폭되지 않게
    var padT = span*0.12, padB = span*0.07;
    return {top:hi+padT, total:span+padT+padB};
  }

  function pctOf(a, px){
    if(px==null || !isFinite(px)) return null;
    return (Number(px) - a.ath) / a.ath * 100;
  }
  function redrawSparks(){ ORDER.forEach(function(id){ drawSpark(BY[id], pctOf(BY[id], state[id] && state[id].px)); }); }

  // 미니 그래프: 상단 0% 점선 · 하락 곡선(블루/시안) · 0% 돌파 시 레드 · 끝점 도트
  function drawSpark(a, live){
    var box = document.getElementById("spk-" + a.id);
    if(!box) return;
    var v = HIST[a.id];
    if(!v || v.length < 2){
      var c0 = SPKC[a.id];
      if(!c0 || !c0.empty){
        box.innerHTML = "";          // 히스토리가 없으면 빈 자리로 둔다(수치 표시는 그대로)
        SPKC[a.id] = {empty:true};
      }
      return;
    }
    var c = SPKC[a.id];
    if(!c || c.arr !== v || c.empty){
      var dm = sparkDomain(v), inner = SPK_H - 2*SPK_PADY;
      var yf = function(val){
        var yy = SPK_PADY + (dm.top - val)/dm.total*inner;
        return Math.max(0.7, Math.min(SPK_H-0.7, yy));
      };
      var n = v.length, step = (SPK_W - 3.1)/n, pts = [], i, x;
      var gc = grpOf(a).c, gl = grpOf(a).l;
      for(i=0;i<n;i++){ x = 0.9 + i*step; pts.push(x.toFixed(2) + "," + yf(v[i]).toFixed(2)); }
      var y0 = yf(0), gid = "sk" + a.id;
      var s0 = Math.max(0, y0-0.6)/SPK_H, s1 = Math.min(SPK_H, y0+0.6)/SPK_H;
      box.innerHTML =
        '<svg viewBox="0 0 ' + SPK_W + ' ' + SPK_H + '" preserveAspectRatio="none" aria-hidden="true">' +
          '<defs>' +
            '<linearGradient id="' + gid + 'l" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="' + SPK_H + '">' +
              '<stop offset="0" stop-color="#FF4D5E"/>' +
              '<stop offset="' + s0.toFixed(3) + '" stop-color="#FF4D5E"/>' +
              '<stop offset="' + s1.toFixed(3) + '" stop-color="' + gl + '"/>' +
              '<stop offset="1" stop-color="' + gc + '"/>' +
            '</linearGradient>' +
            '<linearGradient id="' + gid + 'f" gradientUnits="userSpaceOnUse" x1="0" y1="' + y0.toFixed(2) + '" x2="0" y2="' + SPK_H + '">' +
              '<stop offset="0" stop-color="' + gc + '" stop-opacity=".26"/>' +
              '<stop offset="1" stop-color="' + gc + '" stop-opacity=".01"/>' +
            '</linearGradient>' +
          '</defs>' +
          '<line x1="0.9" y1="' + y0.toFixed(2) + '" x2="' + (SPK_W-1.0) + '" y2="' + y0.toFixed(2) +
            '" stroke="rgba(255,255,255,.22)" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="2 2.4"/>' +
          '<path class="ar" d="" fill="url(#' + gid + 'f)"/>' +
          '<path class="ln" d="" fill="none" stroke="url(#' + gid + 'l)" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round"/>' +
          '<circle class="dg" cx="0" cy="0" r="2.7" fill="#9fe4ff" opacity=".22"/>' +
          '<circle class="dt" cx="0" cy="0" r="1.45" fill="#9fe4ff"/>' +
        '</svg>';
      c = SPKC[a.id] = {
        arr:v, n:n, step:step, y0:y0, yf:yf,
        pre:"M" + pts.join(" L"),
        preA:"M0.90," + y0.toFixed(2) + " L" + pts.join(" L"),
        ln:box.querySelector(".ln"), ar:box.querySelector(".ar"),
        dt:box.querySelector(".dt"), dg:box.querySelector(".dg")
      };
    }
    // 10초마다 갱신되는 현재가로 마지막 점만 이어 그리기
    var lx = (0.9 + c.n*c.step).toFixed(2);
    var lv = (live==null || !isFinite(live)) ? v[v.length-1] : live;
    var ly = Math.max(0.7, Math.min(SPK_H-0.7, c.yf(lv))).toFixed(2);
    if(c.ln) c.ln.setAttribute("d", c.pre + " L" + lx + "," + ly);
    if(c.ar) c.ar.setAttribute("d", c.preA + " L" + lx + "," + ly + " L" + lx + "," + c.y0.toFixed(2) + " Z");
    var col = (lv >= 0) ? "#FF4D5E" : grpOf(a).l;
    if(c.dt){ c.dt.setAttribute("cx", lx); c.dt.setAttribute("cy", ly); c.dt.setAttribute("fill", col); }
    if(c.dg){ c.dg.setAttribute("cx", lx); c.dg.setAttribute("cy", ly); c.dg.setAttribute("fill", col); }
  }

  /* ───────── 렌더 ───────── */
  function buildList(){
    $("#list").innerHTML = ORDER.map(function(id){
      var a = BY[id], g = grpOf(a);
      return '<div class="row stale" id="row-'+a.id+'" style="--acc:'+g.c+';--acc2:'+g.l+'">'+
        '<div class="top">'+
          '<div class="nm">'+a.name+'</div>'+
          '<span class="spk" id="spk-'+a.id+'" aria-hidden="true"></span>'+
          '<div class="px">—</div>'+
          '<div class="pct flat">—</div>'+
        '</div>'+
        '<div class="bot">'+
          '<div class="ath">최고 '+nf(a.ath,a.dec)+' · '+a.athDate+'</div>'+
          '<div class="dc"></div>'+
        '</div>'+
        '<div class="gauge"><i></i></div>'+
      '</div>';
    }).join("");
  }

  function renderRow(a){
    var el = document.getElementById("row-"+a.id);
    if(!el) return;
    var s = state[a.id];
    var pxEl = el.querySelector(".px"), pEl = el.querySelector(".pct"),
        dcEl = el.querySelector(".dc"), athEl = el.querySelector(".ath");

    if(!s || s.px==null){
      el.classList.add("stale");
      pxEl.textContent = "—"; pEl.textContent = "—"; pEl.className = "pct flat";
      dcEl.textContent = "대기";
      try{ drawSpark(a, null); }catch(e){}
      return;
    }

    var px = Number(s.px);
    var isNew = px > a.ath;                       // 3년내 최고점 갱신 시 자동 반영
    var pct = (px - a.ath) / a.ath * 100;         // 미니 그래프의 0% 기준과 동일
    var up = pct > 0.0001;

    el.classList.toggle("stale", (Date.now() - (s.t||0)) > STALE_MS);
    el.classList.toggle("up", up);
    el.classList.toggle("flat", Math.abs(pct) <= 0.0001);
    el.classList.toggle("newhigh", isNew);

    pxEl.textContent = (a.cur||"") + nf(px, a.dec);

    pEl.textContent = (pct>0?"+":"") + pct.toFixed(2) + "%";
    pEl.className = "pct " + (up ? "up" : (pct < -0.0001 ? "down" : "flat"));

    athEl.innerHTML = isNew
      ? '3년내 최고가 갱신 · <b>'+nf(px,a.dec)+'</b>'
      : '최고 <b>'+nf(a.ath,a.dec)+'</b> · '+a.athDate;

    if(s.chg==null || !isFinite(s.chg)){
      dcEl.textContent = a.chgLabel; dcEl.className = "dc";
    }else{
      var c = Number(s.chg);
      dcEl.textContent = a.chgLabel + " " + (c>0?"+":"") + c.toFixed(2) + "%";
      dcEl.className = "dc " + (c>0.001 ? "up" : (c<-0.001 ? "down" : ""));
    }

    el.querySelector(".gauge > i").style.width =
      Math.min(100, Math.abs(pct)/40*100).toFixed(1) + "%";

    try{ drawSpark(a, pct); }catch(e){}
  }

  function renderAll(){ ORDER.forEach(function(id){ renderRow(BY[id]); }); }

  function setStatus(kind, txt, src){
    $("#status").className = "frow " + (kind||"");
    $("#stxt").textContent = txt;
    if(src !== undefined) $("#src").textContent = src;
  }

  function renderMarket(){
    var us = isUSOpen(), kr = isKROpen();
    var u = $("#mktUS"), k = $("#mktKR");
    u.textContent = "미국 " + (us?"장중 ●":"마감 ○");
    k.textContent = "국내 " + (kr?"장중 ●":"마감 ○");
    u.style.color = us ? "#5aa2ff" : "";
    k.style.color = kr ? "#5aa2ff" : "";
  }

  /* ───────── 갱신 ───────── */
  function cache(){
    try{
      var keep = {};
      ORDER.forEach(function(id){ if(state[id] && state[id].px!=null) keep[id] = state[id]; });
      localStorage.setItem("apm.v2", JSON.stringify({t:Date.now(), s:keep}));
    }catch(e){}
  }

  function refresh(){
    if(busy) return;
    busy = true;
    var res = {idx:0, coin:0};

    Promise.all([
      getIndices().then(function(n){ res.idx = n; }).catch(function(){ res.idx = 0; }),
      getCrypto().then(function(n){ res.coin = n; }).catch(function(){ res.coin = 0; })
    ]).then(function(){
      renderAll();
      var okI = res.idx > 0, okC = res.coin > 0;
      var bits = [];
      if(okI) bits.push("Yahoo Finance");
      if(okC) bits.push(srcTag.coin || "CoinGecko");
      $("#src").textContent = bits.length ? bits.join(" · ") : "—";

      var live = $("#live");
      if(okI && okC){
        live.className = "live"; live.textContent = "LIVE";
        setStatus("ok", "마지막 업데이트 " + kstTime(), bits.join(" · "));
      }else if(okI || okC){
        live.className = "live"; live.textContent = "LIVE";
        setStatus("warn", kstTime() + " 일부 지연" + (okI ? " · 코인" : " · 지수"), bits.join(" · "));
      }else{
        live.className = "live off"; live.textContent = "OFF";
        setStatus("", "연결 실패 · 10초 후 재시도", "—");
      }
      if(DBG) $("#stxt").textContent += "  " + diag.join("  ");
    }).catch(function(){
      setStatus("", "표시 오류 · 10초 후 재시도", "—");
    }).then(function(){
      busy = false;
      nextAt = Date.now() + CYCLE;
      cache();
    });
  }

  function restore(){
    try{
      var c = JSON.parse(localStorage.getItem("apm.v2")||"null");
      if(!c || !c.s) return;
      var any = false;
      ORDER.forEach(function(id){ if(c.s[id] && BY[id]){ state[id] = c.s[id]; any = true; } });
      if(any){ renderAll(); setStatus("warn", "저장된 값 표시 · 갱신 중", "cache"); }
    }catch(e){}
  }

  /* ───────── 1초 카운트다운 ───────── */
  var lastSec = -1;
  function tick(){
    var left = Math.max(0, nextAt - Date.now());
    $("#prog").style.transform = "scaleX(" + (left/CYCLE).toFixed(3) + ")";
    var sec = Math.ceil(left/1000);
    if(sec !== lastSec){
      lastSec = sec;
      $("#clock").textContent = kstTime();
      $("#cd").textContent = "10초마다 자동 갱신 · " + sec + "s";
      renderMarket();
    }
    if(left <= 0 && !busy) refresh();
  }
  setInterval(tick, 100);

  $("#refresh").addEventListener("click", function(){
    nextAt = Date.now() + CYCLE;
    if(!busy) refresh();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ nextAt = Date.now() + 200; tick(); }
  });

  /* ───────── 시작 ───────── */
  buildList();
  histRestore();
  restore();
  $("#clock").textContent = kstTime();
  renderMarket();
  refresh();
  setTimeout(loadHist, 600);       // 3년 히스토리는 첫 실시간 조회 뒤 백그라운드로 1회
  setInterval(function(){ if(!busy) renderAll(); }, 30000);

  /* ───────── 화면 꽉 채우기 (9:16 비율 유지) ───────── */
  function fit(){
    var app = $("#app");
    var s = Math.min(app.clientWidth/408, app.clientHeight/800);
    s = Math.max(0.56, Math.min(1.28, s));
    app.style.fontSize = (16*s).toFixed(2) + "px";
  }
  window.addEventListener("resize", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();
  setTimeout(fit, 300);
})();
</script>
</body>
