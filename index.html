<style>
  :root{
    /* Investing.com 다크 톤 */
    --bg:#0C1014;
    --panel:#1B2128;
    --panel2:#20272E;
    --line:rgba(255,255,255,.065);
    --edge:rgba(255,255,255,.085);
    --dim:#8B939D;
    --dim2:#6A727C;
    --up:#EF5A5C;        /* 한국식 상승 = 빨강 */
    --down:#2E7CE0;      /* 한국식 하락 = 파랑 */
    --open:#2FBF71;      /* 장중 */
    --closed:#E5484D;    /* 장마감 */
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#07090B;color:#EDF0F5;font-family:var(--font)}
  body{display:flex;justify-content:center;align-items:stretch;overflow:hidden}

  /* 9:16 세로 프레임 — 모바일은 화면 전체, 데스크톱은 중앙 세로 프레임 */
  #app{
    position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;font-size:16px;
    background:linear-gradient(180deg,#0E1319 0%,#0C1014 42%,#090C10 100%);
    padding:calc(env(safe-area-inset-top,0px) + .46em) .62em calc(env(safe-area-inset-bottom,0px) + .4em);
    box-shadow:0 0 70px rgba(0,0,0,.85);
  }
  @media (min-aspect-ratio: 9/16) and (min-width:480px){
    body{align-items:center;background:radial-gradient(85% 65% at 50% 40%,#11151A 0%,#050708 100%)}
    #app{height:min(100dvh, calc(430px * 16 / 9));border-radius:20px;margin:auto;
      border:1px solid rgba(255,255,255,.07)}
  }

  /* ── 헤더 ── */
  header{flex:0 0 auto;padding:0 .4em}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:.5em}
  .hleft{display:flex;align-items:center;gap:.46em;min-width:0}
  /* 순서 초기화: 저장된 사용자 순서가 있을 때만 조용히 나타난다(기본 레이아웃 불변) */
  .ordreset{all:unset;display:none;cursor:pointer;flex:0 0 auto;white-space:nowrap;
    font-size:.54em;font-weight:700;letter-spacing:.02em;color:var(--dim2);
    padding:.18em .52em;border-radius:99px;border:1px dashed rgba(255,255,255,.16);line-height:1.4}
  .ordreset.on{display:inline-flex;align-items:center;gap:.26em}
  .ordreset svg{width:.95em;height:.95em;display:block;stroke:currentColor;fill:none;
    stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .ordreset:active{color:#C3CBD4;border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.06)}
  .ttl{font-size:.6em;font-weight:700;letter-spacing:.19em;color:var(--dim2);text-transform:uppercase}
  .clock{font-size:.88em;font-weight:700;font-variant-numeric:tabular-nums;color:#D3DAE2;letter-spacing:.01em}
  .clock .tz{font-size:.6em;color:var(--dim2);font-weight:700;margin-left:.34em;letter-spacing:.12em}
  .sub{margin-top:.26em;display:flex;align-items:center;gap:.42em;min-width:0}
  .grad{font-size:1.30em;font-weight:800;letter-spacing:-.028em;line-height:1.16;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{flex:0 0 auto;font-size:.48em;font-weight:800;letter-spacing:.1em;color:#6EE7A8;
    background:rgba(47,191,113,.13);border:1px solid rgba(47,191,113,.34);
    border-radius:99px;padding:.3em .62em;line-height:1.35}
  .live.off{color:#9AA3AD;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  .btn{all:unset;flex:0 0 auto;margin-left:auto;cursor:pointer;display:inline-flex;align-items:center;gap:.3em;
    font-size:.56em;font-weight:700;letter-spacing:.02em;color:#C3CBD4;
    padding:.42em .68em;border-radius:99px;border:1px solid var(--edge);background:#171D24}
  .btn:active{background:#232B33}
  .btn svg{width:.95em;height:.95em;display:block;stroke:#B7C0C9}
  .bar{position:relative;height:2px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:.4em}
  .bar > i{position:absolute;inset:0;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#39424D,#A7B0BB);transform-origin:left center;will-change:transform}
  .barmeta{display:flex;justify-content:space-between;align-items:center;margin-top:.26em;
    font-size:.54em;color:var(--dim2);font-weight:700;letter-spacing:.03em}
  .barmeta .src{font-variant-numeric:tabular-nums;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}

  /* ── 자산 리스트 (20개) ── */
  main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;margin-top:.48em;
    background:var(--panel);border:1px solid var(--edge);border-radius:.68em;overflow:hidden}
  .row{
    position:relative;flex:1 1 0;min-height:0;
    display:flex;flex-direction:column;justify-content:center;
    padding:.12em .6em .15em .74em;overflow:hidden;transition:opacity .45s ease;
  }
  .row + .row{border-top:1px solid var(--line)}
  .row.stale{opacity:.45}

  /* 좌측 상태 인디케이터: 장중=초록 · 장마감=빨강 */
  .row::before{content:"";position:absolute;left:.3em;top:23%;bottom:23%;width:3px;border-radius:99px;
    background:var(--closed);opacity:.92;transition:background .5s ease}
  .row.open::before{background:var(--open);box-shadow:0 0 6px rgba(47,191,113,.25)}

  .top{display:flex;align-items:center;gap:.28em;min-width:0}
  .nm{flex:1 1 auto;min-width:0;font-size:.77em;font-weight:700;color:#FFFFFF;letter-spacing:-.014em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .px{flex:0 0 auto;min-width:4.95em;text-align:right;font-size:1.08em;font-weight:800;color:#fff;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
  .pct{flex:0 0 auto;min-width:3.85em;margin-left:.22em;text-align:right;font-size:1.24em;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.028em;line-height:1.05;color:var(--down)}
  .pct.up{color:var(--up)}
  .pct.flat{color:#A7AFB9}

  .bot{display:flex;align-items:baseline;justify-content:space-between;gap:.5em;min-width:0;margin-top:.08em}
  .ath{font-size:.56em;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em}
  .ath b{color:#B6BFC8;font-weight:700}
  .dc{flex:0 0 auto;font-size:.56em;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dc.up{color:var(--up)}
  .dc.down{color:var(--down)}
  .row.newhigh .ath b{color:#FFC663}

  /* ── 3년 월별 추이 미니 그래프 (월별 상승=빨강 · 하락=파랑) ── */
  .spk{flex:0 0 auto;width:58px;height:21px;display:block;align-self:center;
    margin:0 .12em 0 .22em;overflow:visible;pointer-events:none}
  .spk svg{display:block;width:58px;height:21px}

  /* ── 행 드래그 순서 변경 (모바일 롱프레스 · PC 마우스) ── */
  #list{touch-action:pan-y}                      /* 평소엔 세로 스크롤 허용, 드래그 중에만 preventDefault */
  .row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  @media (hover:hover){ .row{cursor:grab} }
  .row.ghost{transition:transform .17s cubic-bezier(.2,.7,.25,1),opacity .45s ease;will-change:transform}
  .row.dragging{
    z-index:6;cursor:grabbing;transition:none;will-change:transform;
    background:#232B35;border-radius:.4em;
    box-shadow:0 12px 28px rgba(0,0,0,.62),0 0 0 1px rgba(150,185,225,.55),0 0 26px rgba(120,170,230,.16);
  }
  .row.dragging::before{opacity:1}
  body.dragging{user-select:none;-webkit-user-select:none}

  /* ── 푸터 ── */
  footer{flex:0 0 auto;padding:.44em .4em 0;display:flex;flex-direction:column;gap:.28em}
  .mrow{display:flex;gap:.28em}
  .mkt{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:.3em;min-width:0;
    padding:.4em .3em;border-radius:.5em;border:1px solid var(--edge);background:#161C22;
    font-size:.54em;font-weight:700;color:#B9C1CA;letter-spacing:.01em;white-space:nowrap}
  .mkt i{flex:0 0 auto;width:.66em;height:.66em;border-radius:99px;background:var(--closed);
    box-shadow:0 0 0 .2em rgba(229,72,77,.14)}
  /* 장중 = 초록 동그라미 1초 주기 점멸 / 장마감 = 빨강 고정 */
  .mkt.open i{background:var(--open);box-shadow:0 0 0 .2em rgba(47,191,113,.16);
    animation:mktBlink 1s ease-in-out infinite}
  @keyframes mktBlink{
    0%,100%{opacity:1;box-shadow:0 0 0 .2em rgba(47,191,113,.20),0 0 6px rgba(47,191,113,.75)}
    50%{opacity:.26;box-shadow:0 0 0 .06em rgba(47,191,113,.05),0 0 1px rgba(47,191,113,.2)}
  }
  @media (prefers-reduced-motion: reduce){
    .mkt.open i{animation:none;box-shadow:0 0 0 .2em rgba(47,191,113,.2),0 0 5px rgba(47,191,113,.6)}
  }
  .mkt .flag{flex:0 0 auto;width:1.32em;height:.9em;display:block;border-radius:.11em;overflow:hidden;
    box-shadow:0 0 0 .5px rgba(255,255,255,.22);opacity:.96}
  .mkt b{font-weight:800;color:#C9D1DA;letter-spacing:0}
  .mkt .st{font-weight:800;color:var(--closed);white-space:nowrap}
  .mkt.open .st{color:#4ED493}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:.5em;
    font-size:.54em;color:var(--dim2);font-weight:700;padding:0 .12em}
  .frow > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .src{font-variant-numeric:tabular-nums;opacity:.9;text-align:right}
</style>
</head>

  /* ───────── 자산 정의 · 3년내(2024~2026) 최고점 기준(고정값) ─────────

      if(i >= HROUTES.length) return Promise.reject(new Error("all hist routes failed"));
      var r = HROUTES[i++];
      return getText(r.f(u), r.ms).then(jsonLoose).catch(function(e){
        if(DBG) dg("h:" + r.n + " x");
        return next();
      });
    }
    return next();
  }

  // 월 종가 → ((종가 - 3년내 최고점) / 최고점) * 100
  // 마지막 봉은 진행 중인 이번 달이라 현재가(10초 갱신)로 이어 그리므로 뺀다.
  function histSeries(a, closes){
    var v = [];
    for(var i=0;i<closes.length;i++){
      var c = closes[i];
      if(c==null || !isFinite(c) || c<=0) continue;
      v.push(Math.round((c - a.ath) / a.ath * 10000) / 100);
    }
    if(v.length > 3) v.pop();
    return v.length >= 2 ? v : null;
  }
  function histApply(d){
    var n = 0;
    ASSETS.forEach(function(a){
      var node = d && d[histSym(a)];
      if(!node) return;
      var v = histSeries(a, node.close || node.c || []);
      if(v){ HIST[a.id] = v; n++; }
    });
    return n;
  }
  function histSave(){
    try{ localStorage.setItem(HIST_KEY, JSON.stringify({t:histAt, d:HIST})); }catch(e){}
  }
  function histRestore(){
    try{
      var c = JSON.parse(localStorage.getItem(HIST_KEY) || "null");
      if(!c || !c.d) return;
      ORDER.forEach(function(id){ if(c.d[id] && c.d[id].length>1) HIST[id] = c.d[id]; });
      histAt = c.t || 0;
    }catch(e){}
  }

  function loadHist(){
    var miss = ASSETS.some(function(a){ return histSym(a) && !HIST[a.id]; });
    if(!miss && histAt && (Date.now() - histAt) < HIST_TTL) return;
    histGet(histURL()).then(function(d){
      var n = histApply(d);
      if(!n) throw new Error("no symbols");
      histAt = Date.now(); histSave(); redrawSparks();
      if(DBG) dg("hist " + n);
    }).catch(function(){
      if(DBG) dg("hist fail");
      loadHistOne();      // 폴백: 심볼별 chart (연속 2회 실패하면 중단)
    });
  }
  /* CSI 300: Yahoo `000300.SS`는 range=3y·interval=1mo에도 봉을 1개만 준다.
     동방재부(Eastmoney) 월봉(klt=103) 40개월을 받아 3년(36개월)만 쓴다. */
  var EM_CSI_URL = "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.000300" +
    "&fields1=f1,f2,f3&fields2=f51,f53&klt=103&fqt=1&end=20500101&lmt=40";
  function loadHistCSI(){
    histGet(EM_CSI_URL).then(function(d){
      var k = d && d.data && d.data.klines;
      if(!Array.isArray(k) || !k.length) throw new Error("no klines");
      var closes = k.map(function(s){ return parseFloat(String(s).split(",")[1]); }).slice(-37);
      var v = histSeries(BY.csi300, closes);
      if(!v) throw new Error("no series");
      HIST.csi300 = v; histAt = Date.now(); histSave();
      drawSpark(BY.csi300, pctOf(BY.csi300, state.csi300 && state.csi300.px));
      if(DBG) dg("hist em " + v.length);
    }).catch(function(){ if(DBG) dg("hist em fail"); });

  /* 사우디 TASI: Yahoo ^TASI.SR은 range=3y·interval=1mo에도 봉을 1개만 준다(장중 시세만 유효).
     그래서 3년 월별 종가는 investing.com 히스토리 API에서 받는다. 이 API는 CORS를 열어 주지만
     `domain-id: www` 헤더가 없으면 403/챌린지(Just a moment)가 뜨므로 헤더를 붙여 직접 호출한다. */
  var INV_TASI = "https://api.investing.com/api/financialdata/historical/11319";   // 11319 = Tadawul All Share (TASI)
  function invDate(d){
    var m = d.getMonth()+1, dd = d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
  }
  function invNum(s){
    var v = parseFloat(String(s==null ? "" : s).replace(/,/g,""));
    return isFinite(v) ? v : null;
  }
  function invGet(url, ms){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, ms || 8000);
    return fetch(url, {signal:ctl.signal, cache:"no-store", mode:"cors", credentials:"omit",
        headers:{"domain-id":"www", "accept":"application/json"}})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(t){ clearTimeout(timer); return jsonLoose(t); },
            function(e){ clearTimeout(timer); throw e; });
  }
  var tasiHistTry = 0;
  function loadHistTASI(){
    if(HIST.tasi && histAt && (Date.now() - histAt) < HIST_TTL) return;
    var now = new Date();
    var from = new Date(now.getFullYear(), now.getMonth()-36, 1);
    var url = INV_TASI + "?start-date=" + invDate(from) + "&end-date=" + invDate(now) +
              "&time-frame=Monthly&add-missing-rows=false&_=" + Date.now();
    invGet(url, 9000).then(function(d){
      var rows = d && d.data;
      if(!Array.isArray(rows) || rows.length < 6) throw new Error("no rows");
      var closes = rows.slice().reverse().map(function(r){ return invNum(r.last_closeRaw!=null ? r.last_closeRaw : r.last_close); });
      var v = histSeries(BY.tasi, closes);
      if(!v) throw new Error("no series");
      HIST.tasi = v; histAt = Date.now(); histSave();
      drawSpark(BY.tasi, pctOf(BY.tasi, state.tasi && state.tasi.px));
      if(DBG) dg("hist tasi " + v.length);
      tasiHistTry = 0;
    }).catch(function(e){
      if(DBG) dg("hist tasi fail:" + ((e&&e.message)||e));
      if(tasiHistTry++ < 2) setTimeout(loadHistTASI, 15000);
    });
  }
  /* Yahoo가 TASI를 90초 넘게 못 줄 때: investing.com 일별 종가로 현재가·전일 대비를 대신한다 */
  function tasiInvesting(){
    var now = new Date();
    var from = new Date(now.getTime() - 14*86400000);
    return invGet(INV_TASI + "?start-date=" + invDate(from) + "&end-date=" + invDate(now) +
                  "&time-frame=Daily&add-missing-rows=false&_=" + Date.now(), 7000)
      .then(function(d){
        var rows = d && d.data;
        if(!Array.isArray(rows) || !rows.length) throw new Error("no tasi rows");
        var px = invNum(rows[0].last_closeRaw!=null ? rows[0].last_closeRaw : rows[0].last_close);
        if(px==null || px<=0) throw new Error("bad tasi px");
        var prev = rows[1] ? invNum(rows[1].last_closeRaw!=null ? rows[1].last_closeRaw : rows[1].last_close) : null;
        state.tasi = {px:px, chg:(prev ? (px-prev)/prev*100 : null), t:Date.now()};
        srcTag.sa = "investing.com";
        return 1;
      });
  }

  /* 코스피200 야간선물: Yahoo에 선물 심볼이 없어 investing.com 월봉(최근월물 연속 8987)으로 3년 월별 종가를 채운다.

  var INV_K200 = "https://api.investing.com/api/financialdata/historical/8987";

  function loadHistOne(){
    var list = ASSETS.filter(function(a){ return histSym(a) && !HIST[a.id]; });
    var i = 0, bad = 0;
    function step(){
      if(i >= list.length || bad >= 2) return;
      var a = list[i++];
      var u = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(histSym(a)) +
        "?range=3y&interval=1mo&_=" + Date.now();
      histGet(u).then(function(d){
        var r = d && d.chart && d.chart.result && d.chart.result[0];
        var q = r && r.indicators && r.indicators.quote && r.indicators.quote[0];
        var v = histSeries(a, (q && q.close) || []);
        if(!v) throw new Error("no series");
        HIST[a.id] = v; bad = 0; histAt = Date.now(); redrawSparks();
      }).catch(function(){ bad++; }).then(function(){
        if(i >= list.length || bad >= 2){ histAt = Date.now(); histSave(); }
        else setTimeout(step, 250);
      });
    }
    step();
  }

  function sparkDomain(v){
    var mn = 0, mx = 0;
    for(var i=0;i<v.length;i++){ if(v[i] < mn) mn = v[i]; if(v[i] > mx) mx = v[i]; }
    var hi = Math.max(0, mx), lo = Math.min(0, mn), span = hi - lo;
    if(span < 10){ lo = hi - 10; span = 10; }     // 변동이 작아도 노이즈가 증폭되지 않게
    var padT = span*0.10, padB = span*0.08;
    return {top:hi+padT, total:span+padT+padB};
  }

  function pctOf(a, px){
    if(px==null || !isFinite(px)) return null;
    return (Number(px) - a.ath) / a.ath * 100;
  }
  function redrawSparks(){
    ORDER.forEach(function(id){ drawSpark(BY[id], pctOf(BY[id], state[id] && state[id].px)); });
  }

  /* 미니 그래프: 3년 월별 흐름. 전월 대비 오른 구간 = 빨강, 내린 구간 = 파랑.
     마지막 구간(직전 월 → 현재가)도 같은 규칙으로 색이 바뀐다. */
  function drawSpark(a, live){
    var box = document.getElementById("spk-" + a.id);
    if(!box) return;
    var v = HIST[a.id];
    if(!v || v.length < 2){
      var c0 = SPKC[a.id];
      if(!c0 || !c0.empty){
        box.innerHTML = "";          // 히스토리가 없으면 빈 자리로 둔다(수치 표시는 그대로)
        SPKC[a.id] = {empty:true};
      }
      return;
    }
    var c = SPKC[a.id];
    if(!c || c.arr !== v || c.empty){
      var dm = sparkDomain(v), inner = SPK_H - 2*SPK_PAD;
      var yf = function(val){
        var yy = SPK_PAD + (dm.top - val)/dm.total*inner;
        return Math.max(1, Math.min(SPK_H-1, yy));
      };
      var n = v.length, step = (SPK_W - 3.4)/n, i;
      var xf = function(k){ return (1.2 + k*step); };
      var segs = "";
      for(i=1;i<n;i++){
        var rise = v[i] >= v[i-1];
        segs += '<line x1="'+xf(i-1).toFixed(2)+'" y1="'+yf(v[i-1]).toFixed(2)+'" x2="'+xf(i).toFixed(2)+'" y2="'+yf(v[i]).toFixed(2)+
                '" stroke="'+(rise?UP:DOWN)+'" stroke-width="1.25" stroke-linecap="round"/>';
      }
      var y0 = yf(0);
      box.innerHTML =
        '<svg viewBox="0 0 ' + SPK_W + ' ' + SPK_H + '" aria-hidden="true">' +
          '<line x1="1.2" y1="'+y0.toFixed(2)+'" x2="'+(SPK_W-1.4)+'" y2="'+y0.toFixed(2)+
            '" stroke="rgba(255,255,255,.16)" stroke-width=".8" stroke-dasharray="2 2.4"/>' +
          segs +
          '<line class="lv" x1="0" y1="0" x2="0" y2="0" stroke="'+DOWN+'" stroke-width="1.35" stroke-linecap="round"/>' +
          '<circle class="dt" cx="0" cy="0" r="1.75" fill="'+DOWN+'"/>' +
        '</svg>';
      c = SPKC[a.id] = {
        arr:v, n:n, step:step, xf:xf, yf:yf,
        lv:box.querySelector(".lv"), dt:box.querySelector(".dt")
      };
    }
    // 10초마다 갱신되는 현재가로 마지막 구간만 다시 긋는다
    var lv = (live==null || !isFinite(live)) ? v[v.length-1] : live;
    var lastV = v[v.length-1];
    var lx = c.xf(c.n).toFixed(2), ly = c.yf(lv).toFixed(2);
    var col = (lv >= lastV) ? UP : DOWN;
    if(c.lv){
      c.lv.setAttribute("x1", c.xf(c.n-1).toFixed(2));
      c.lv.setAttribute("y1", c.yf(lastV).toFixed(2));
      c.lv.setAttribute("x2", lx);
      c.lv.setAttribute("y2", ly);
      c.lv.setAttribute("stroke", col);
    }
    if(c.dt){ c.dt.setAttribute("cx", lx); c.dt.setAttribute("cy", ly); c.dt.setAttribute("fill", col); }
  }

  /* ───────── 렌더 ───────── */
  function buildList(){

  function renderRow(a){
    var el = document.getElementById("row-"+a.id);
    if(!el) return;
    var s = priceOf(a);
    var pxEl = el.querySelector(".px"), pEl = el.querySelector(".pct"),
        dcEl = el.querySelector(".dc"), athEl = el.querySelector(".ath"),
        nmEl = el.querySelector(".nm");

    // 장중/마감에 따라 행 이름 자동 전환: 삼성전자 ↔ 삼성전자 예상가
    var nm = rowName(a);
    if(nmEl && nmEl.textContent !== nm) nmEl.textContent = nm;

    // 좌측 상태 색: 장중(초록) / 장마감(빨강)
    el.classList.toggle("open", isLive(a));

    if(!s || s.px==null){
      el.classList.add("stale");
      pxEl.textContent = "—"; pEl.textContent = "—"; pEl.className = "pct flat";
      dcEl.textContent = "대기";
      try{ drawSpark(a, null); }catch(e){}
      return;
    }

    var px = Number(s.px);
    var isNew = px > a.ath;                       // 3년내 최고점 갱신 시 자동 반영
    var pct = (px - a.ath) / a.ath * 100;         // 미니 그래프의 0% 기준과 동일
    var up = pct > 0.0001;

    el.classList.toggle("stale", (Date.now() - (s.t||0)) > STALE_MS);
    el.classList.toggle("newhigh", isNew);

    pxEl.textContent = (a.cur||"") + nf(px, a.dec);

    pEl.textContent = (pct>0?"+":"") + pct.toFixed(2) + "%";
    pEl.className = "pct " + (up ? "up" : (pct < -0.0001 ? "down" : "flat"));

    athEl.innerHTML = isNew
      ? '3년내 최고가 갱신 · <b>'+nf(px,a.dec)+'</b>'
      : '최고 <b>'+nf(a.ath,a.dec)+'</b> · '+a.athDate;

    if(s.chg==null || !isFinite(s.chg)){
      dcEl.textContent = a.chgLabel; dcEl.className = "dc";
    }else{
      var ch = Number(s.chg);
      dcEl.textContent = a.chgLabel + " " + (ch>0?"+":"") + ch.toFixed(2) + "%";
      dcEl.className = "dc " + (ch>0.001 ? "up" : (ch<-0.001 ? "down" : ""));
    }

    try{ drawSpark(a, pct); }catch(e){}
  }

  function renderMarket(){

  /* ───────── 행 순서 변경: 모바일 롱프레스 · PC 마우스 드래그 + 저장 ─────────
     - 터치: 250ms 길게 누르면 드래그가 붙고(15ms 진동 + 들뜬 그림자/테두리), 그 뒤 위아래로 끌면 실시간으로 자리를 바꾼다.
       250ms 안에 8px 넘게 움직이면 스크롤로 보고 드래그를 포기한다. 드래그 중에만 preventDefault로 스크롤을 막는다.
     - 마우스: 누른 뒤 8px 이상 움직이면 드래그 시작(user-select:none으로 텍스트 선택 방지).
     - 핸들 열을 두지 않고 행 자체를 잡으므로 기존 4열 구조(이름·미니그래프·가격·변동률)는 그대로다.
     - 순서는 localStorage(assetMonitor.order.v1)에 저장해 새로고침·재방문·10초 자동 갱신에도 유지한다. */
  var ORD_KEY = "assetMonitor.order.v1";
  var BASE_ORDER = ORDER.slice();          // 코드에 정의된 기본 순서
  var HOLD_MS = 250, SLOP = 8;             // 터치 롱프레스 시간 / 손짓 허용 오차(px)
  var drag = null, settleT = 0, settleEl = null, settleTo = 0;
  var lp = {el:null, t:0, y0:0, x0:0};     // 롱프레스 대기 상태

  function listRows(){ return Array.prototype.slice.call($("#list").children); }

  function ordSave(){
    try{
      if(ORDER.join(",") === BASE_ORDER.join(",")) localStorage.removeItem(ORD_KEY);
      else localStorage.setItem(ORD_KEY, JSON.stringify(ORDER));
    }catch(e){}
  }
  /* 저장된 순서를 되살린다. 저장 이후 새로 추가된 자산은 기본 순서의 앞뒤 이웃 사이로 자연스럽게 합류시킨다. */
  function ordRestore(){
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(ORD_KEY) || "null"); }catch(e){}
    if(!Array.isArray(saved) || !saved.length) return;
    var out = [], seen = {};
    saved.forEach(function(id){
      if(typeof id === "string" && BY[id] && !seen[id]){ out.push(id); seen[id] = 1; }
    });
    if(!out.length) return;
    BASE_ORDER.forEach(function(id, i){
      if(seen[id]) return;
      var at = -1, k;
      for(k = i-1; k >= 0; k--){                        // 앞쪽 이웃 바로 뒤
        if(seen[BASE_ORDER[k]]){ at = out.indexOf(BASE_ORDER[k]) + 1; break; }
      }
      if(at < 0){
        for(k = i+1; k < BASE_ORDER.length; k++){        // 앞쪽 이웃이 없으면 뒤쪽 이웃 바로 앞
          if(seen[BASE_ORDER[k]]){ at = out.indexOf(BASE_ORDER[k]); break; }
        }
      }
      if(at < 0 || at > out.length) at = out.length;
      out.splice(at, 0, id); seen[id] = 1;
    });
    ORDER = out;
  }
  function ordSetUI(){
    var b = document.getElementById("ordreset");
    if(b) b.classList.toggle("on", ORDER.join(",") !== BASE_ORDER.join(","));

  function dragPick(e){

  }
  function dragStart(kind, el, x, y){
    flushSettle();                                   // 직전 드롭 정산이 남아 있으면 먼저 마무리
    var rows = listRows(), idx = rows.indexOf(el);
    if(idx < 0) return null;
    return {kind:kind, el:el, idx:idx, target:idx, x0:x, y0:y, dy:0,
            rows:rows, rowH:el.getBoundingClientRect().height, active:false};
  }
  function dragEngage(d){
    d.active = true;
    d.el.classList.add("dragging");
    document.body.classList.add("dragging");
    for(var i=0;i<d.rows.length;i++) if(d.rows[i] !== d.el) d.rows[i].classList.add("ghost");
    try{ if(navigator.vibrate) navigator.vibrate(15); }catch(e){}   // 가벼운 햅틱
  }
  function dragMove(d, y){
    d.dy = y - d.y0;
    var h = d.rowH || 1, last = d.rows.length - 1;
    var t = Math.round(d.dy / h) + d.idx;            // 이웃 행 높이 단위로 자리 계산
    if(t < 0) t = 0;
    if(t > last) t = last;
    d.target = t;
    d.el.style.transform = "translateY(" + d.dy.toFixed(1) + "px)";
    for(var i=0;i<d.rows.length;i++){
      var r = d.rows[i];
      if(r === d.el) continue;
      var off = 0;
      if(t > d.idx && i > d.idx && i <= t) off = -h;        // 빈자리를 메우러 위로
      else if(t < d.idx && i >= t && i < d.idx) off = h;    // 빈자리를 메우러 아래로
      r.style.transform = off ? "translateY(" + off.toFixed(1) + "px)" : "";
    }
  }
  function clearDrag(rows){
    (rows || listRows()).forEach(function(r){
      r.style.transition = ""; r.style.transform = "";
      r.classList.remove("dragging"); r.classList.remove("ghost");
    });
    document.body.classList.remove("dragging");
  }
  /* DOM을 새 순서로 바꾸고 저장한다. 바꾸기 직전 좌표와 직후 자연 좌표가 같아 화면이 튀지 않는다. */
  function placeAt(el, target){
    var list = $("#list");
    var rest = listRows().filter(function(r){ return r !== el; });
    list.insertBefore(el, rest[target] || null);
    clearDrag();
    ORDER = listRows().map(function(r){ return r.getAttribute("data-id"); }).filter(Boolean);
    ordSave(); ordSetUI(); renderAll();
  }
  function flushSettle(){
    if(!settleT) return;
    clearTimeout(settleT); settleT = 0;
    var el = settleEl, to = settleTo;
    settleEl = null;
    if(el && el.parentNode) placeAt(el, to);
  }
  function dragDrop(d, keep){
    d.active = false;
    var el = d.el, tgt = keep ? d.target : d.idx;
    el.style.transition = "transform .15s cubic-bezier(.2,.7,.25,1)";
    el.style.transform = "translateY(" + ((tgt - d.idx) * d.rowH).toFixed(1) + "px)";
    drag = null;
    if(tgt === d.idx){
      setTimeout(function(){ clearDrag(d.rows); }, 130);
    }else{
      settleEl = el; settleTo = tgt;
      settleT = setTimeout(flushSettle, 150);
    }
  }

  (function wireDrag(){
    var L = $("#list");

    /* ── 터치: 롱프레스로 드래그 시작 ── */
    L.addEventListener("touchstart", function(e){
      if(e.touches.length !== 1) return;
      var el = dragPick(e);
      if(!el) return;
      var t0 = e.touches[0];
      lp.el = el; lp.y0 = t0.clientY; lp.x0 = t0.clientX;
      if(lp.t) clearTimeout(lp.t);
      lp.t = setTimeout(function(){
        lp.t = 0;
        var el2 = lp.el;
        if(!el2) return;
        var d = dragStart("touch", el2, lp.x0, lp.y0);
        if(!d) return;
        drag = d; dragEngage(d);
      }, HOLD_MS);
    }, {passive:true});

    L.addEventListener("touchmove", function(e){
      if(drag && drag.active){
        e.preventDefault();                        // 드래그가 붙은 뒤에만 스크롤을 막는다
        if(e.touches[0]) dragMove(drag, e.touches[0].clientY);
        return;
      }
      if(lp.el && e.touches[0]){
        var t1 = e.touches[0];
        if(Math.abs(t1.clientY - lp.y0) > SLOP || Math.abs(t1.clientX - lp.x0) > SLOP){
          if(lp.t){ clearTimeout(lp.t); lp.t = 0; }   // 스크롤하려는 손짓 → 롱프레스 취소
          lp.el = null;
        }
      }
    }, {passive:false});

    function touchDone(e){
      if(lp.t){ clearTimeout(lp.t); lp.t = 0; }
      lp.el = null;
      if(drag && drag.active){
        if(e.cancelable) e.preventDefault();
        dragDrop(drag, true);
      }
    }
    L.addEventListener("touchend", touchDone, {passive:false});
    L.addEventListener("touchcancel", touchDone, {passive:false});

    /* ── 마우스: 8px 움직이면 드래그 시작 ── */
    L.addEventListener("mousedown", function(e){
      if(e.button !== 0) return;
      var el = dragPick(e);
      if(!el) return;
      var d = dragStart("mouse", el, e.clientX, e.clientY);
      if(!d) return;
      drag = d;
      if(e.cancelable) e.preventDefault();          // 텍스트 선택 방지
    });
    document.addEventListener("mousemove", function(e){
      if(!drag || drag.kind !== "mouse") return;
      if(!drag.active){
        if(Math.abs(e.clientX - drag.x0) <= SLOP && Math.abs(e.clientY - drag.y0) <= SLOP) return;
        dragEngage(drag);
      }
      if(e.cancelable) e.preventDefault();
      dragMove(drag, e.clientY);
    });
    document.addEventListener("mouseup", function(){
      if(!drag || drag.kind !== "mouse") return;
      if(drag.active) dragDrop(drag, true);
      else drag = null;
    });
    L.addEventListener("contextmenu", function(e){ if(drag) e.preventDefault(); });
    document.addEventListener("selectstart", function(e){ if(drag && drag.active) e.preventDefault(); });
    document.addEventListener("dragstart", function(e){
      var t2 = e.target;
      if(t2 && t2.closest && t2.closest("#list")) e.preventDefault();   // 브라우저 기본 끌기 방지
    });

    /* ── 순서 초기화(저장된 사용자 순서가 있을 때만 보임) ── */
    var rb = document.getElementById("ordreset");
    if(rb) rb.addEventListener("click", function(){
      ORDER = BASE_ORDER.slice();
      try{ localStorage.removeItem(ORD_KEY); }catch(e){}
      var list = $("#list");
      ORDER.forEach(function(id){
        var el = document.getElementById("row-" + id);
        if(el) list.appendChild(el);
      });
      clearDrag(); renderAll(); ordSetUI();
    });
  })();

  /* ───────── 갱신 ───────── */
  function race(p, ms){
    return new Promise(function(resolve, reject){
      var done = false;
      var t = setTimeout(function(){ if(!done){ done = true; reject(new Error("timeout")); } }, ms);
      p.then(function(v){ if(!done){ done = true; clearTimeout(t); resolve(v); } },
             function(e){ if(!done){ done = true; clearTimeout(t); reject(e); } });
    });
  }

  function cache(){
    try{
      var keep = {};
      ORDER.forEach(function(id){ if(state[id] && state[id].px!=null) keep[id] = state[id]; });
      var ks = {};
      ORDER.forEach(function(id){ if(STK[id] && STK[id].px!=null) ks[id] = STK[id]; });
      localStorage.setItem("apm.v2", JSON.stringify({t:Date.now(), s:keep, k:ks}));
    }catch(e){}
  }

  var busyAt = 0;
  function refresh(){
    if(busy && Date.now() - busyAt < 45000) return;   // 45초 넘게 멈춘 갱신은 버리고 새로 시작
    busy = true; busyAt = Date.now();
    var krNow = krLiveNow();        // 장중이면 삼성전자·SK하이닉스는 네이버 현재가, 마감이면 KOSPILAB 예상가
    var res = {idx:0, coin:0, kp:0, kr:0, stk:0, asia:0, sa:0, k200:0};

    var tasks = [
      race(getIndices(), 14000).then(function(n){ res.idx = n; }).catch(function(){ res.idx = 0; }),
      race(getKorea(), 13000).then(function(n){ res.kr = n; }).catch(function(){ res.kr = 0; }),
      race(getAsia(), 13000).then(function(n){ res.asia = n; }).catch(function(){ res.asia = 0; }),
      race(getCrypto(), 14000).then(function(n){ res.coin = n; }).catch(function(){ res.coin = 0; })
    ];
    if(krNow){
      tasks.push(race(getStocks(), 13000).then(function(n){ res.stk = n; }).catch(function(){ res.stk = 0; }));
    }else{
      tasks.push(race(kospilab(), 20000).then(function(n){ res.kp = n; }).catch(function(){ res.kp = 0; }));
    }
    // 코스피200 야간선물: 프록시(jina) 부담을 줄이려 25초 간격으로만 받는다(가격은 화면에서 계속 재렌더)
    if(!state.k200 || (Date.now() - (state.k200.t||0)) > 25000){
      tasks.push(race(getK200(), 11000).then(function(n){ res.k200 = n; }).catch(function(){ res.k200 = 0; }));
    }
    // 사우디 TASI: Yahoo(YSYMS에 포함)가 90초 넘게 값을 못 주면 investing.com 종가로 대신 채운다
    if(!state.tasi || (Date.now() - (state.tasi.t||0)) > 90000){
      tasks.push(race(tasiInvesting(), 9000).then(function(n){ res.sa = n; }).catch(function(){ res.sa = 0; }));
    }

    Promise.all(tasks).then(function(){
      renderAll();
      var okI = res.idx > 0, okC = res.coin > 0, okR = res.kr > 0, okA = res.asia > 0;
      var okStock = (krNow ? res.stk : res.kp) > 0;
      var bits = [];
      if(okI) bits.push("Yahoo Finance");
      if(okA) bits.push(srcTag.asia || "해외지수");
      if(okR) bits.push(srcTag.kr || "네이버 증권");
      if(!krNow && res.kp > 0) bits.push("KOSPILAB");
      if(res.sa > 0) bits.push(srcTag.sa || "investing.com");
      if(res.k200 > 0) bits.push(srcTag.k200 || "PreKOSPI");
      if(okC) bits.push(srcTag.coin || "CoinGecko");
      $("#src").textContent = bits.length ? bits.join(" · ") : "—";
      $("#src2").textContent = bits.length ? bits.join(" · ") : "—";

      var live = $("#live");
      if(okI && okC && okR && okA && okStock){
        live.className = "live"; live.textContent = "LIVE";
        setStatus("ok", "마지막 업데이트 " + kstTime());
      }else if(okI || okC || okR || okA || okStock){
        live.className = "live"; live.textContent = "LIVE";
        var miss = [];
        if(!okI) miss.push("지수");
        if(!okR) miss.push("한국지수");
        if(!okA) miss.push("닛케이·CSI");
        if(!okStock) miss.push(krNow ? "한국현재가" : "예상가");
        if(!okC) miss.push("코인");
        setStatus("warn", kstTime() + " 일부 지연 · " + miss.join("·"));
      }else{
        live.className = "live off"; live.textContent = "OFF";
        setStatus("", "연결 실패 · 10초 후 재시도");
      }
      if(DBG) $("#stxt").textContent += "  " + diag.join("  ");
    }).catch(function(){
      setStatus("", "표시 오류 · 10초 후 재시도");
    }).then(function(){
      busy = false;
      nextAt = Date.now() + CYCLE;
      cache();
    });
  }

  function restore(){
    try{
      var c = JSON.parse(localStorage.getItem("apm.v2")||"null");
      if(!c || !c.s) return;
      var any = false;
      ORDER.forEach(function(id){ if(c.s[id] && BY[id]){ state[id] = c.s[id]; any = true; } });
      if(c.k) ORDER.forEach(function(id){ if(c.k[id] && BY[id]) STK[id] = c.k[id]; });
      if(any){ renderAll(); setStatus("warn", "저장된 값 표시 · 갱신 중"); }
    }catch(e){}
  }

  /* ───────── 1초 카운트다운 + 장 상태 전환 ───────── */
  var lastSec = -1;
  function tick(){
    var left = Math.max(0, nextAt - Date.now());
    $("#prog").style.transform = "scaleX(" + (left/CYCLE).toFixed(3) + ")";
    var sec = Math.ceil(left/1000);
    if(sec !== lastSec){
      lastSec = sec;
      $("#clock").textContent = kstTime();
      $("#cd").textContent = "10초마다 자동 갱신 · " + sec + "s";
      computeMarkets();
      renderMarket();
      ORDER.forEach(function(id){ renderRow(BY[id]); });   // 장중/마감 색 자동 전환
    }
    if(left <= 0 && !busy) refresh();
  }
  setInterval(tick, 100);

  $("#refresh").addEventListener("click", function(){
    nextAt = Date.now() + CYCLE;
    if(!busy) refresh();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ nextAt = Date.now() + 200; tick(); }
  });

  /* ───────── 시작 ───────── */
  computeMarkets();
  ordRestore();                     // 저장된 사용자 순서가 있으면 먼저 되살리고 그 순서로 그린다
  buildList();
  ordSetUI();
  $("#cnt").textContent = ASSETS.length;
  histRestore();
  restore();
  $("#clock").textContent = kstTime();
  renderMarket();
  refresh();
  setTimeout(loadHist, 600);       // 3년 월별 히스토리는 첫 실시간 조회 뒤 백그라운드로 1회
  setTimeout(loadHistCSI, 1200);   // CSI 300 월봉은 동방재부에서 따로
  setTimeout(loadHistTASI, 1400);  // 사우디 TASI 월봉은 investing.com에서 따로
  setTimeout(loadHistK200, 1700);   // 코스피200 야간선물 월봉도 investing.com에서 따로
  setInterval(function(){ if(!busy) renderAll(); }, 30000);

  /* ───────── 화면 꽉 채우기 (9:16 비율 유지) ───────── */
  function fit(){
    var app = $("#app");
    var s = Math.min(app.clientWidth/408, app.clientHeight/800);
    s = Math.max(0.56, Math.min(1.28, s));
    app.style.fontSize = (16*s).toFixed(2) + "px";
  }
  window.addEventListener("resize", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();
  setTimeout(fit, 300);
})();
</script>
