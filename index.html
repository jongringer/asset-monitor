  .frow{display:flex;align-items:center;justify-content:space-between;gap:.5em;
    font-size:.54em;color:var(--dim2);font-weight:700;padding:0 .12em}
  .frow > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .src{font-variant-numeric:tabular-nums;opacity:.9;text-align:right}
</style>

<script>
(function(){

     mkt: us = 미국 정규장 · cme = 미국 선물(글롭엑스) · kr = 한국 정규장 · fx = 외환 · coin = 24/7 */
  var ASSETS = [
    {id:"sp500", name:"S&P 500",         yahoo:"^GSPC", mkt:"us",   ath:7844.52,  athDate:"26.10 장중",    dec:2, cur:"$", chgLabel:"전일"},

    {id:"ndx",   name:"나스닥 100",       yahoo:"^NDX",  mkt:"us",   ath:31361.37, athDate:"26.10.06 장중", dec:2, cur:"$", chgLabel:"전일"},

    {id:"rut",   name:"러셀 2000",        yahoo:"^RUT",  mkt:"us",   ath:3069.71,  athDate:"26.08.14 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"sox",   name:"필라델피아 반도체", yahoo:"^SOX",  mkt:"us",   ath:14655.29, athDate:"26.06.22 장중", dec:2, cur:"",  chgLabel:"전일"},
    {id:"kospi", name:"코스피",           yahoo:"^KS11", mkt:"kr",   ath:9385.59,  athDate:"26.06.19 장중", dec:2, cur:"",  chgLabel:"전일"},
    {id:"kosdaq",name:"코스닥",           yahoo:"^KQ11", mkt:"kr",   ath:1226.18,  athDate:"26.04.27 종가", dec:2, cur:"",  chgLabel:"전일"},
    {id:"skhy",  name:"SK하이닉스 ADR",   yahoo:"SKHY",  mkt:"us",   ath:199.87,   athDate:"26.09.09 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"gold",  name:"금 (COMEX)",       yahoo:"GC=F",  mkt:"cme",  ath:5595.46,  athDate:"26.01 장중",    dec:2, cur:"$", chgLabel:"전일"},
    {id:"wti",   name:"WTI 유",           yahoo:"CL=F",  mkt:"cme",  ath:119.48,   athDate:"26.03.09 장중", dec:2, cur:"$", chgLabel:"전일"},
    {id:"btc",   name:"비트코인",         yahoo:null,    mkt:"coin", histSym:"BTC-USD", ath:126198, athDate:"25.10.06 장중", dec:0, cur:"$", chgLabel:"24h"},
    {id:"eth",   name:"이더리움",         yahoo:null,    mkt:"coin", histSym:"ETH-USD", ath:4953.73, athDate:"25.08.24 장중", dec:2, cur:"$", chgLabel:"24h"},
    {id:"krw",   name:"원/달러 환율",     yahoo:"KRW=X", mkt:"fx",   ath:1587.70,  athDate:"26.07.09 장중", dec:2, cur:"",  chgLabel:"전일"}
  ];
  var BY = {}, ORDER = [];
  ASSETS.forEach(function(a){ BY[a.id]=a; ORDER.push(a.id); });

  var UP = "#EF5A5C", DOWN = "#2E7CE0";     // 한국식 상승(빨강) / 하락(파랑)

  var YSYMS = ASSETS.filter(function(a){return a.yahoo;}).map(function(a){return a.yahoo;});
  var CYCLE = 10000;       // 10초마다 자동 갱신
  var STALE_MS = 120000;   // 2분 넘게 갱신 안 된 값은 흐리게

  var state = {}, busy = false;
  var nextAt = Date.now() + CYCLE;
  var srcTag = {coin:null};

  /* 주소 뒤에 ?debug=1 을 붙이면 각 데이터 경로의 시도 결과·소요시간을 하단에 표시 */
  var DBG = /[?&]debug/.test(location.search);
  var diag = [];
  function dg(s){ diag.push(s); while(diag.length>7) diag.shift(); }

  /* ───────── 유틸 ───────── */
  function $(s){ return document.querySelector(s); }
  function nf(v,d){ return (v==null||!isFinite(v)) ? "—" : Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function kstTime(d){
    return new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Seoul",hour12:false,
      hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(d||new Date());
  }
  function tzNow(tz){
    var o={};
    new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",
      weekday:"short",hour:"2-digit",minute:"2-digit"})
      .formatToParts(new Date()).forEach(function(p){ o[p.type]=p.value; });
    var h = parseInt(o.hour,10)%24;
    return {wd:o.weekday, ymd:o.year+"-"+o.month+"-"+o.day, t:h*60+parseInt(o.minute,10)};
  }

  /* ───────── 거래시간 · 휴장일 판정 ─────────
     미국 정규장 09:30~16:00 ET (조기마감일 13:00 ET) · 미국 선물 글롭엑스 일요일 18:00~금요일 17:00 ET,
     매일 17:00~18:00 ET 점검 휴장 · 한국 정규장 09:00~15:30 KST · 외환 일요일 17:00~금요일 17:00 ET · 가상자산 24/7 */
  var NY = "America/New_York", KSTZ = "Asia/Seoul";
  var US_HOL = {  // NYSE·나스닥 휴장일 (2026~2027)
    "2026-01-01":1,"2026-01-19":1,"2026-02-16":1,"2026-04-03":1,"2026-05-25":1,"2026-06-19":1,
    "2026-07-03":1,"2026-09-07":1,"2026-11-26":1,"2026-12-25":1,
    "2027-01-01":1,"2027-01-18":1,"2027-02-15":1,"2027-03-26":1,"2027-05-31":1,"2027-06-18":1,
    "2027-07-05":1,"2027-09-06":1,"2027-11-25":1,"2027-12-24":1
  };
  var US_EARLY = {"2026-11-27":780,"2026-12-24":780,"2027-11-26":780};   // 13:00 ET 조기마감
  var KR_HOL = {  // 한국거래소 휴장일
    "2026-01-01":1,"2026-02-16":1,"2026-02-17":1,"2026-02-18":1,"2026-03-02":1,"2026-05-01":1,
    "2026-05-05":1,"2026-05-25":1,"2026-06-03":1,"2026-07-17":1,"2026-08-17":1,"2026-09-24":1,
    "2026-09-25":1,"2026-10-05":1,"2026-10-09":1,"2026-12-25":1,"2026-12-31":1,
    "2027-01-01":1
  };

  function usOpen(){
    var p = tzNow(NY);
    if(p.wd==="Sat"||p.wd==="Sun") return false;
    if(US_HOL[p.ymd]) return false;
    var close = US_EARLY[p.ymd] || 960;
    return p.t>=570 && p.t<close;
  }
  function cmeOpen(){
    var p = tzNow(NY);
    if(p.wd==="Sat") return false;
    if(p.wd==="Sun") return p.t>=1080;          // 일요일 18:00 ET 개장
    if(p.wd==="Fri") return p.t<1020;           // 금요일 17:00 ET 마감
    return !(p.t>=1020 && p.t<1080);            // 월~목 17:00~18:00 ET 일일 점검 휴장
  }
  function krOpen(){
    var p = tzNow(KSTZ);
    if(p.wd==="Sat"||p.wd==="Sun") return false;
    if(KR_HOL[p.ymd]) return false;
    return p.t>=540 && p.t<930;                 // 09:00~15:30 KST
  }
  function fxOpen(){
    var p = tzNow(NY);
    if(p.wd==="Sat") return false;
    if(p.wd==="Sun") return p.t>=1080;
    if(p.wd==="Fri") return p.t<1020;
    return true;
  }
  var OPENERS = {us:usOpen, cme:cmeOpen, kr:krOpen, fx:fxOpen, coin:function(){ return true; }};

  var MK = {us:false, cme:false, kr:false, fx:false, coin:true};
  function computeMarkets(){
    try{
      MK.us = usOpen(); MK.cme = cmeOpen(); MK.kr = krOpen(); MK.fx = fxOpen();
    }catch(e){}
    MK.coin = true;
  }
  function isLive(a){ return !!MK[a.mkt]; }

  function getText(url, ms){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, ms);
    return fetch(url, {signal:ctl.signal, cache:"no-store", mode:"cors", credentials:"omit"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(t){ clearTimeout(timer); return t; }, function(e){ clearTimeout(timer); throw e; });
  }
  function jsonLoose(txt){        // 프록시가 앞뒤에 안내문을 붙여도 JSON만 뽑아낸다
    if(!txt) throw new Error("empty");
    var i = txt.indexOf("{"), j = txt.lastIndexOf("}");
    if(i<0 || j<i) throw new Error("not json");
    return JSON.parse(txt.slice(i,j+1));
  }

  /* ───────── 지수·금·원유·환율: Yahoo (브라우저 CORS 차단 → 프록시 폴백 체인) ───────── */
  function yahooURL(){
    return "https://query1.finance.yahoo.com/v8/finance/spark?symbols=" +
      encodeURIComponent(YSYMS.join(",")) + "&range=1d&interval=1d&_=" + Date.now();
  }
  var ROUTES = [
    {n:"jina",      f:function(u){ return "https://r.jina.ai/" + u; },            ms:6000},
    {n:"codetabs",  f:function(u){ return "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u); }, ms:4000},
    {n:"allorigins",f:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }, ms:4000},
    {n:"cors.lol",  f:function(u){ return "https://api.cors.lol/?url=" + encodeURIComponent(u); }, ms:4000},
    {n:"direct",    f:function(u){ return u; }, ms:4000}
  ];
  // 두 개씩 동시에 시도하고 먼저 성공한 쪽을 쓴다 (성공한 조합을 다음에 우선 시도)
  var GROUPS = [[0,3],[1,2],[4]];
  var prefGroup = 0;

  function oneRoute(ri, target){
    var r = ROUTES[ri];
    return getText(r.f(target), r.ms).then(jsonLoose).then(function(d){ return {d:d, gi:ri, name:r.n}; });
  }
  function firstOf(list, target){
    return new Promise(function(resolve, reject){
      var left = list.length, dead = 0;
      if(!left) return reject(new Error("empty group"));
      list.forEach(function(ri){
        oneRoute(ri, target).then(resolve, function(e){
          if(DBG) dg("x"+ROUTES[ri].n+":"+((e&&e.message)||e));
          if(++dead === left) reject(e || new Error("group failed"));
        });
      });
    });
  }
  function getIndices(){
    var target = yahooURL();
    var gi = 0;
    function attempt(){
      if(gi >= GROUPS.length) return Promise.reject(new Error("all routes failed"));
      var g = GROUPS[(prefGroup + gi) % GROUPS.length];
      gi++;
      return firstOf(g, target).then(function(hit){
        var d = hit.d;
        if(!d || typeof d!=="object") throw new Error("bad payload");
        var n = 0, now = Date.now();
        ASSETS.forEach(function(a){
          if(!a.yahoo) return;
          var node = d[a.yahoo];
          if(!node) return;
          var px = (node.close && node.close.length) ? node.close[node.close.length-1] : null;
          if((px==null||!isFinite(px)) && isFinite(node.fulldayPrice)) px = node.fulldayPrice;
          if(px==null||!isFinite(px)) return;
          var chg = isFinite(node.fulldayChangePercent) ? node.fulldayChangePercent
                  : ((isFinite(node.chartPreviousClose) && node.chartPreviousClose)
                      ? (px-node.chartPreviousClose)/node.chartPreviousClose*100 : null);
          state[a.id] = {px:px, chg:chg, t:now};
          n++;
        });
        if(!n) throw new Error("no symbols");
        prefGroup = GROUPS.indexOf(g);
        if(DBG) dg("idx:"+hit.name+" n="+n);
        return n;
      }).catch(function(e){
        if(DBG) dg("idx fail:"+((e&&e.message)||e));
        return attempt();
      });
    }
    return attempt();
  }

  /* ───────── 가상자산: CoinGecko → OKX → Upbit ───────── */
  function setCoin(id, px, chg){ if(isFinite(px)) state[id] = {px:px, chg:chg, t:Date.now()}; }
  function coinGecko(){
    return getText("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true&_="+Date.now(), 5000)
      .then(function(t){
        var d = JSON.parse(t);
        if(!d || !d.bitcoin || !d.ethereum) throw new Error("bad");
        setCoin("btc", d.bitcoin.usd, d.bitcoin.usd_24h_change);
        setCoin("eth", d.ethereum.usd, d.ethereum.usd_24h_change);
        srcTag.coin = "CoinGecko"; return 2;
      });
  }
  function okx(){
    return Promise.all([["btc","BTC-USDT"],["eth","ETH-USDT"]].map(function(p){
      return getText("https://www.okx.com/api/v5/market/ticker?instId="+p[1]+"&_="+Date.now(), 5000)
        .then(function(t){
          var d = JSON.parse(t), row = d && d.data && d.data[0];
          if(!row) throw new Error("bad");
          var last = parseFloat(row.last), open = parseFloat(row.open24h);
          setCoin(p[0], last, (isFinite(open)&&open) ? (last-open)/open*100 : null);
        });
    })).then(function(){ srcTag.coin = "OKX"; return 2; });
  }
  function upbit(){
    return getText("https://api.upbit.com/v1/ticker?markets=USDT-BTC,USDT-ETH&_="+Date.now(), 5000)
      .then(function(t){
        var d = JSON.parse(t);
        if(!Array.isArray(d) || !d.length) throw new Error("bad");
        d.forEach(function(r){
          var id = (r.market.indexOf("BTC")>0) ? "btc" : "eth";
          setCoin(id, r.trade_price, (r.signed_change_rate!=null ? r.signed_change_rate*100 : null));
        });
        srcTag.coin = "Upbit"; return 2;
      });
  }
  function getCrypto(){
    var t0 = Date.now();
    return coinGecko().catch(okx).catch(upbit)
      .then(function(n){ if(DBG) dg("coin:"+(Date.now()-t0)+"ms "+(srcTag.coin||"?")); return n; },
            function(e){ if(DBG) dg("coin:"+(Date.now()-t0)+"ms fail"); throw e; });
  }

  /* ───────── 3년 월별(약 36개월) 히스토리 → 자산명 옆 미니 스파크라인 ───────── */
  var SPK_W = 58, SPK_H = 21, SPK_PAD = 2.6;
  var HIST_KEY = "apm.hist.v4", HIST_TTL = 6*3600*1000;
  var HIST = {}, histAt = 0, SPKC = {};

  function histSym(a){ return a.histSym || a.yahoo; }

  // 14개 심볼을 한 요청으로 (12개 지수·선물·원자재·환율 + BTC-USD·ETH-USD), 3년 월별
  function histURL(){
    var syms = [];
    ASSETS.forEach(function(a){ var s = histSym(a); if(s) syms.push(s); });
    return "https://query1.finance.yahoo.com/v8/finance/spark?symbols=" +
      encodeURIComponent(syms.join(",")) + "&range=3y&interval=1mo&_=" + Date.now();
  }

  // 히스토리는 프록시를 한 번에 하나씩만(부하 최소화) 시도
  var HROUTES = [
    {n:"jina",       f:function(u){ return "https://r.jina.ai/" + u; }, ms:9000},
    {n:"codetabs",   f:function(u){ return "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u); }, ms:7000},
    {n:"allorigins", f:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }, ms:7000},
    {n:"cors.lol",   f:function(u){ return "https://api.cors.lol/?url=" + encodeURIComponent(u); }, ms:7000},
    {n:"direct",     f:function(u){ return u; }, ms:6000}
  ];
  function histGet(u){
    var i = 0;
    function next(){
      if(i >= HROUTES.length) return Promise.reject(new Error("all hist routes failed"));
      var r = HROUTES[i++];
      return getText(r.f(u), r.ms).then(jsonLoose).catch(function(e){
        if(DBG) dg("h:" + r.n + " x");
        return next();
      });
    }
    return next();
  }

  // 월 종가 → ((종가 - 3년내 최고점) / 최고점) * 100
  // 마지막 봉은 진행 중인 이번 달이라 현재가(10초 갱신)로 이어 그리므로 뺀다.
  function histSeries(a, closes){
    var v = [];
    for(var i=0;i<closes.length;i++){
      var c = closes[i];
      if(c==null || !isFinite(c) || c<=0) continue;
      v.push(Math.round((c - a.ath) / a.ath * 10000) / 100);
    }
    if(v.length > 3) v.pop();
    return v.length >= 2 ? v : null;
  }
  function histApply(d){
    var n = 0;
    ASSETS.forEach(function(a){
      var node = d && d[histSym(a)];
      if(!node) return;
      var v = histSeries(a, node.close || node.c || []);
      if(v){ HIST[a.id] = v; n++; }
    });
    return n;
  }
  function histSave(){
    try{ localStorage.setItem(HIST_KEY, JSON.stringify({t:histAt, d:HIST})); }catch(e){}
  }
  function histRestore(){
    try{
      var c = JSON.parse(localStorage.getItem(HIST_KEY) || "null");
      if(!c || !c.d) return;
      ORDER.forEach(function(id){ if(c.d[id] && c.d[id].length>1) HIST[id] = c.d[id]; });
      histAt = c.t || 0;
    }catch(e){}
  }

  function loadHist(){
    var miss = ASSETS.some(function(a){ return !HIST[a.id]; });
    if(!miss && histAt && (Date.now() - histAt) < HIST_TTL) return;
    histGet(histURL()).then(function(d){
      var n = histApply(d);
      if(!n) throw new Error("no symbols");
      histAt = Date.now(); histSave(); redrawSparks();
      if(DBG) dg("hist " + n);
    }).catch(function(){
      if(DBG) dg("hist fail");
      loadHistOne();      // 폴백: 심볼별 chart (연속 2회 실패하면 중단)
    });
  }
  function loadHistOne(){
    var list = ASSETS.filter(function(a){ return !HIST[a.id]; });
    var i = 0, bad = 0;
    function step(){
      if(i >= list.length || bad >= 2) return;
      var a = list[i++];
      var u = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(histSym(a)) +
        "?range=3y&interval=1mo&_=" + Date.now();
      histGet(u).then(function(d){
        var r = d && d.chart && d.chart.result && d.chart.result[0];
        var q = r && r.indicators && r.indicators.quote && r.indicators.quote[0];
        var v = histSeries(a, (q && q.close) || []);
        if(!v) throw new Error("no series");
        HIST[a.id] = v; bad = 0; histAt = Date.now(); redrawSparks();
      }).catch(function(){ bad++; }).then(function(){
        if(i >= list.length || bad >= 2){ histAt = Date.now(); histSave(); }
        else setTimeout(step, 250);
      });
    }
    step();
  }

  function sparkDomain(v){
    var mn = 0, mx = 0;
    for(var i=0;i<v.length;i++){ if(v[i] < mn) mn = v[i]; if(v[i] > mx) mx = v[i]; }
    var hi = Math.max(0, mx), lo = Math.min(0, mn), span = hi - lo;
    if(span < 10){ lo = hi - 10; span = 10; }     // 변동이 작아도 노이즈가 증폭되지 않게
    var padT = span*0.10, padB = span*0.08;
    return {top:hi+padT, total:span+padT+padB};
  }

  function pctOf(a, px){
    if(px==null || !isFinite(px)) return null;
    return (Number(px) - a.ath) / a.ath * 100;
  }
  function redrawSparks(){
    ORDER.forEach(function(id){ drawSpark(BY[id], pctOf(BY[id], state[id] && state[id].px)); });
  }

  /* 미니 그래프: 3년 월별 흐름. 전월 대비 오른 구간 = 빨강, 내린 구간 = 파랑.
     마지막 구간(직전 월 → 현재가)도 같은 규칙으로 색이 바뀐다. */
  function drawSpark(a, live){
    var box = document.getElementById("spk-" + a.id);
    if(!box) return;
    var v = HIST[a.id];
    if(!v || v.length < 2){
      var c0 = SPKC[a.id];
      if(!c0 || !c0.empty){
        box.innerHTML = "";          // 히스토리가 없으면 빈 자리로 둔다(수치 표시는 그대로)
        SPKC[a.id] = {empty:true};
      }
      return;
    }
    var c = SPKC[a.id];
    if(!c || c.arr !== v || c.empty){
      var dm = sparkDomain(v), inner = SPK_H - 2*SPK_PAD;
      var yf = function(val){
        var yy = SPK_PAD + (dm.top - val)/dm.total*inner;
        return Math.max(1, Math.min(SPK_H-1, yy));
      };
      var n = v.length, step = (SPK_W - 3.4)/n, i;
      var xf = function(k){ return (1.2 + k*step); };
      var segs = "";
      for(i=1;i<n;i++){
        var rise = v[i] >= v[i-1];
        segs += '<line x1="'+xf(i-1).toFixed(2)+'" y1="'+yf(v[i-1]).toFixed(2)+'" x2="'+xf(i).toFixed(2)+'" y2="'+yf(v[i]).toFixed(2)+
                '" stroke="'+(rise?UP:DOWN)+'" stroke-width="1.25" stroke-linecap="round"/>';
      }
      var y0 = yf(0);
      box.innerHTML =
        '<svg viewBox="0 0 ' + SPK_W + ' ' + SPK_H + '" aria-hidden="true">' +
          '<line x1="1.2" y1="'+y0.toFixed(2)+'" x2="'+(SPK_W-1.4)+'" y2="'+y0.toFixed(2)+
            '" stroke="rgba(255,255,255,.16)" stroke-width=".8" stroke-dasharray="2 2.4"/>' +
          segs +
          '<line class="lv" x1="0" y1="0" x2="0" y2="0" stroke="'+DOWN+'" stroke-width="1.35" stroke-linecap="round"/>' +
          '<circle class="dt" cx="0" cy="0" r="1.75" fill="'+DOWN+'"/>' +
        '</svg>';
      c = SPKC[a.id] = {
        arr:v, n:n, step:step, xf:xf, yf:yf,
        lv:box.querySelector(".lv"), dt:box.querySelector(".dt")
      };
    }
    // 10초마다 갱신되는 현재가로 마지막 구간만 다시 긋는다
    var lv = (live==null || !isFinite(live)) ? v[v.length-1] : live;
    var lastV = v[v.length-1];
    var lx = c.xf(c.n).toFixed(2), ly = c.yf(lv).toFixed(2);
    var col = (lv >= lastV) ? UP : DOWN;
    if(c.lv){
      c.lv.setAttribute("x1", c.xf(c.n-1).toFixed(2));
      c.lv.setAttribute("y1", c.yf(lastV).toFixed(2));
      c.lv.setAttribute("x2", lx);
      c.lv.setAttribute("y2", ly);
      c.lv.setAttribute("stroke", col);
    }
    if(c.dt){ c.dt.setAttribute("cx", lx); c.dt.setAttribute("cy", ly); c.dt.setAttribute("fill", col); }
  }

  /* ───────── 렌더 ───────── */
  function buildList(){
    $("#list").innerHTML = ORDER.map(function(id){
      var a = BY[id];
      return '<div class="row stale" id="row-'+a.id+'">'+
        '<div class="top">'+
          '<div class="nm">'+a.name+'</div>'+
          '<span class="spk" id="spk-'+a.id+'" aria-hidden="true"></span>'+
          '<div class="px">—</div>'+
          '<div class="pct flat">—</div>'+
        '</div>'+
        '<div class="bot">'+
          '<div class="ath">최고 '+nf(a.ath,a.dec)+' · '+a.athDate+'</div>'+
          '<div class="dc"></div>'+
        '</div>'+
      '</div>';
    }).join("");
  }

  function renderRow(a){
    var el = document.getElementById("row-"+a.id);
    if(!el) return;
    var s = state[a.id];
    var pxEl = el.querySelector(".px"), pEl = el.querySelector(".pct"),
        dcEl = el.querySelector(".dc"), athEl = el.querySelector(".ath");

    // 좌측 상태 색: 장중(초록) / 장마감(빨강)
    el.classList.toggle("open", isLive(a));

    if(!s || s.px==null){
      el.classList.add("stale");
      pxEl.textContent = "—"; pEl.textContent = "—"; pEl.className = "pct flat";
      dcEl.textContent = "대기";
      try{ drawSpark(a, null); }catch(e){}
      return;
    }

    var px = Number(s.px);
    var isNew = px > a.ath;                       // 3년내 최고점 갱신 시 자동 반영
    var pct = (px - a.ath) / a.ath * 100;         // 미니 그래프의 0% 기준과 동일
    var up = pct > 0.0001;

    el.classList.toggle("stale", (Date.now() - (s.t||0)) > STALE_MS);
    el.classList.toggle("newhigh", isNew);

    pxEl.textContent = (a.cur||"") + nf(px, a.dec);

    pEl.textContent = (pct>0?"+":"") + pct.toFixed(2) + "%";
    pEl.className = "pct " + (up ? "up" : (pct < -0.0001 ? "down" : "flat"));

    athEl.innerHTML = isNew
      ? '3년내 최고가 갱신 · <b>'+nf(px,a.dec)+'</b>'
      : '최고 <b>'+nf(a.ath,a.dec)+'</b> · '+a.athDate;

    if(s.chg==null || !isFinite(s.chg)){
      dcEl.textContent = a.chgLabel; dcEl.className = "dc";
    }else{
      var ch = Number(s.chg);
      dcEl.textContent = a.chgLabel + " " + (ch>0?"+":"") + ch.toFixed(2) + "%";
      dcEl.className = "dc " + (ch>0.001 ? "up" : (ch<-0.001 ? "down" : ""));
    }

    try{ drawSpark(a, pct); }catch(e){}
  }

  function renderAll(){ ORDER.forEach(function(id){ renderRow(BY[id]); }); }

  function setStatus(kind, txt){
    $("#stxt").textContent = txt;
  }

  /* 푸터: 미국·국내 시장 상태 — 장중이면 초록 동그라미, 마감이면 빨강 동그라미 */
  function renderMarket(){
    function one(el, live, label){
      el.classList.toggle("open", live);
      el.querySelector(".st").textContent = live ? "장중" : "마감";
      el.setAttribute("aria-label", label + (live ? " 장중" : " 마감"));
    }
    one($("#mktUS"), MK.us, "미국 시장");
    one($("#mktKR"), MK.kr, "국내 시장");
  }

  /* ───────── 갱신 ───────── */
  function cache(){
    try{
      var keep = {};
      ORDER.forEach(function(id){ if(state[id] && state[id].px!=null) keep[id] = state[id]; });
      localStorage.setItem("apm.v2", JSON.stringify({t:Date.now(), s:keep}));
    }catch(e){}
  }

  function refresh(){
    if(busy) return;
    busy = true;
    var res = {idx:0, coin:0};

    Promise.all([
      getIndices().then(function(n){ res.idx = n; }).catch(function(){ res.idx = 0; }),
      getCrypto().then(function(n){ res.coin = n; }).catch(function(){ res.coin = 0; })
    ]).then(function(){
      renderAll();
      var okI = res.idx > 0, okC = res.coin > 0;
      var bits = [];
      if(okI) bits.push("Yahoo Finance");
      if(okC) bits.push(srcTag.coin || "CoinGecko");
      $("#src").textContent = bits.length ? bits.join(" · ") : "—";
      $("#src2").textContent = bits.length ? bits.join(" · ") : "—";

      var live = $("#live");
      if(okI && okC){
        live.className = "live"; live.textContent = "LIVE";
        setStatus("ok", "마지막 업데이트 " + kstTime());
      }else if(okI || okC){
        live.className = "live"; live.textContent = "LIVE";
        setStatus("warn", kstTime() + " 일부 지연" + (okI ? " · 코인" : " · 지수"));
      }else{
        live.className = "live off"; live.textContent = "OFF";
        setStatus("", "연결 실패 · 10초 후 재시도");
      }
      if(DBG) $("#stxt").textContent += "  " + diag.join("  ");
    }).catch(function(){
      setStatus("", "표시 오류 · 10초 후 재시도");
    }).then(function(){
      busy = false;
      nextAt = Date.now() + CYCLE;
      cache();
    });
  }

  function restore(){
    try{
      var c = JSON.parse(localStorage.getItem("apm.v2")||"null");
      if(!c || !c.s) return;
      var any = false;
      ORDER.forEach(function(id){ if(c.s[id] && BY[id]){ state[id] = c.s[id]; any = true; } });
      if(any){ renderAll(); setStatus("warn", "저장된 값 표시 · 갱신 중"); }
    }catch(e){}
  }

  /* ───────── 1초 카운트다운 + 장 상태 전환 ───────── */
  var lastSec = -1;
  function tick(){
    var left = Math.max(0, nextAt - Date.now());
    $("#prog").style.transform = "scaleX(" + (left/CYCLE).toFixed(3) + ")";
    var sec = Math.ceil(left/1000);
    if(sec !== lastSec){
      lastSec = sec;
      $("#clock").textContent = kstTime();
      $("#cd").textContent = "10초마다 자동 갱신 · " + sec + "s";
      computeMarkets();
      renderMarket();
      ORDER.forEach(function(id){ renderRow(BY[id]); });   // 장중/마감 색 자동 전환
    }
    if(left <= 0 && !busy) refresh();
  }
  setInterval(tick, 100);

  $("#refresh").addEventListener("click", function(){
    nextAt = Date.now() + CYCLE;
    if(!busy) refresh();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ nextAt = Date.now() + 200; tick(); }
  });

  /* ───────── 시작 ───────── */
  buildList();
  histRestore();
  restore();
  computeMarkets();
  $("#clock").textContent = kstTime();
  renderMarket();
  refresh();
  setTimeout(loadHist, 600);       // 3년 월별 히스토리는 첫 실시간 조회 뒤 백그라운드로 1회
  setInterval(function(){ if(!busy) renderAll(); }, 30000);

  /* ───────── 화면 꽉 채우기 (9:16 비율 유지) ───────── */
  function fit(){
    var app = $("#app");
    var s = Math.min(app.clientWidth/408, app.clientHeight/800);
    s = Math.max(0.56, Math.min(1.28, s));
    app.style.fontSize = (16*s).toFixed(2) + "px";
  }
  window.addEventListener("resize", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();
  setTimeout(fit, 300);
})();
</script>
