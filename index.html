<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#0C1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>주요 자산 현황 · 3년내 최고점 대비 변동률</title>
<meta name="description" content="S&amp;P500·US500 선물·나스닥·다우·러셀2000·필라델피아 반도체·닛케이 225·CSI 300·코스피·코스닥·코스피200 야간선물·삼성전자·SK하이닉스·SK하이닉스 ADR·금·WTI·사우디 타다울(TASI)·비트코인·이더리움·원달러 환율과 하이퍼리퀴드 Hyperliquid xyz 8종(S&amp;P500·엔비디아·SOXL·SK하이닉스·WTI유·마이크론·브렌트유·EWY)까지 28개 자산의 3년내 최고점 대비 변동률과 3년 월별 추이 그래프를 10초마다 실시간으로 보여줍니다. 삼성전자·SK하이닉스는 한국장 장중에 현재가, 마감 후엔 예상가로 자동 전환됩니다.">
<meta property="og:title" content="주요 자산 현황 · 3년내 최고점 대비 변동률">
<meta property="og:description" content="28개 주요 자산(미국·한국·일본·중국·사우디 + 하이퍼리퀴드 xyz 8종)의 3년내 최고점 대비 변동률 실시간 모니터">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    /* Investing.com 다크 톤 */
    --bg:#0C1014;
    --panel:#1B2128;
    --panel2:#20272E;
    --line:rgba(255,255,255,.065);
    --edge:rgba(255,255,255,.085);
    --dim:#8B939D;
    --dim2:#6A727C;
    --up:#EF5A5C;        /* 한국식 상승 = 빨강 */
    --down:#2E7CE0;      /* 한국식 하락 = 파랑 */
    --open:#2FBF71;      /* 장중 */
    --closed:#E5484D;    /* 장마감 */
    --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#07090B;color:#EDF0F5;font-family:var(--font)}
  body{display:flex;justify-content:center;align-items:stretch;overflow:hidden}

  /* 9:16 세로 프레임 — 모바일은 화면 전체, 데스크톱은 중앙 세로 프레임 */
  #app{
    position:relative;width:100%;max-width:430px;height:100dvh;overflow:hidden;
    display:flex;flex-direction:column;font-size:16px;
    background:linear-gradient(180deg,#0E1319 0%,#0C1014 42%,#090C10 100%);
    padding:calc(env(safe-area-inset-top,0px) + .46em) .62em calc(env(safe-area-inset-bottom,0px) + .4em);
    box-shadow:0 0 70px rgba(0,0,0,.85);
  }
  @media (min-aspect-ratio: 9/16) and (min-width:480px){
    body{align-items:center;background:radial-gradient(85% 65% at 50% 40%,#11151A 0%,#050708 100%)}
    #app{height:min(100dvh, calc(430px * 16 / 9));border-radius:20px;margin:auto;
      border:1px solid rgba(255,255,255,.07)}
  }

  /* ── 헤더 ── */
  header{flex:0 0 auto;padding:0 .4em}
  /* 봉 단위 전환(월봉·주봉·일봉): 헤더 맨 위 세그먼트 */
  .tfb{display:flex;align-items:center;justify-content:space-between;gap:.45em;margin:0 0 .36em}
  .tfs{display:flex;flex:0 0 auto;gap:.14em;padding:.15em;border-radius:99px;
    background:#12181E;border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
  .tfs button{all:unset;cursor:pointer;flex:0 0 auto;min-width:2.9em;text-align:center;
    font-size:.68em;font-weight:800;letter-spacing:.01em;color:#8B939D;
    padding:.85em .95em;border-radius:99px;line-height:1.2;
    transition:background .16s ease,color .16s ease,box-shadow .16s ease}
  .tfs button.on{color:#0B0F14;background:linear-gradient(180deg,#E7EEF7 0%,#BCCCDF 100%);
    box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.65)}
  .tfs button:active{background:rgba(255,255,255,.12)}
  .tfs button.on:active{background:linear-gradient(180deg,#D8E2EE 0%,#AEBECF 100%)}
  .tfh{flex:1 1 auto;min-width:0;text-align:right;font-size:.58em;font-weight:700;letter-spacing:.02em;
    color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .hrow{display:flex;align-items:baseline;justify-content:space-between;gap:.5em}
  .hleft{display:flex;align-items:center;gap:.46em;min-width:0}
  /* 순서 초기화: 저장된 사용자 순서가 있을 때만 조용히 나타난다(기본 레이아웃 불변) */
  .ordreset{all:unset;display:none;cursor:pointer;flex:0 0 auto;white-space:nowrap;
    font-size:.6em;font-weight:700;letter-spacing:.02em;color:var(--dim2);
    padding:.18em .52em;border-radius:99px;border:1px dashed rgba(255,255,255,.16);line-height:1.4}
  .ordreset.on{display:inline-flex;align-items:center;gap:.26em}
  .ordreset svg{width:.95em;height:.95em;display:block;stroke:currentColor;fill:none;
    stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  .ordreset:active{color:#C3CBD4;border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.06)}
  .ttl{font-size:.64em;font-weight:700;letter-spacing:.19em;color:var(--dim2);text-transform:uppercase}
  .clock{font-size:.88em;font-weight:700;font-variant-numeric:tabular-nums;color:#D3DAE2;letter-spacing:.01em}
  .clock .tz{font-size:.6em;color:var(--dim2);font-weight:700;margin-left:.34em;letter-spacing:.12em}
  .sub{margin-top:.26em;display:flex;align-items:center;gap:.42em;min-width:0}
  .grad{font-size:1.30em;font-weight:800;letter-spacing:-.028em;line-height:1.16;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .live{flex:0 0 auto;font-size:.52em;font-weight:800;letter-spacing:.1em;color:#6EE7A8;
    background:rgba(47,191,113,.13);border:1px solid rgba(47,191,113,.34);
    border-radius:99px;padding:.3em .62em;line-height:1.35}
  .live.off{color:#9AA3AD;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
  .btn{all:unset;flex:0 0 auto;margin-left:auto;cursor:pointer;display:inline-flex;align-items:center;gap:.3em;
    font-size:.6em;font-weight:700;letter-spacing:.02em;color:#C3CBD4;
    padding:.42em .68em;border-radius:99px;border:1px solid var(--edge);background:#171D24}
  .btn:active{background:#232B33}
  .btn svg{width:.95em;height:.95em;display:block;stroke:#B7C0C9}
  .bar{position:relative;height:2px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:.4em}
  .bar > i{position:absolute;inset:0;width:100%;border-radius:99px;
    background:linear-gradient(90deg,#39424D,#A7B0BB);transform-origin:left center;will-change:transform}
  .barmeta{display:flex;justify-content:space-between;align-items:center;margin-top:.26em;
    font-size:.6em;color:var(--dim2);font-weight:700;letter-spacing:.03em}
  .barmeta .src{font-variant-numeric:tabular-nums;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52%}

  /* ── 자산 리스트 (28개 · 스크롤) ── */
  main{flex:1 1 auto;display:block;min-height:0;margin-top:.5em;
    background:var(--panel);border:1px solid var(--edge);border-radius:.68em;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
  main::-webkit-scrollbar{width:4px}
  main::-webkit-scrollbar-track{background:transparent}
  main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
  .row{
    position:relative;
    display:flex;flex-direction:column;justify-content:center;
    padding:.54em .44em .52em .6em;overflow:hidden;transition:opacity .45s ease;
  }
  .row + .row{border-top:1px solid var(--line)}
  /* 하이퍼리퀴드 xyz 8종: 딥 슬레이트 네이비 바탕으로 기존 행과 은은하게 구분 */
  .row.xyz{background:#171E31}
  .row + .row.xyz{border-top-color:rgba(124,160,220,.18)}
  .row.stale{opacity:.45}

  /* 좌측 상태 인디케이터: 장중=초록 · 장마감=빨강 */
  .row::before{content:"";position:absolute;left:.3em;top:23%;bottom:23%;width:3px;border-radius:99px;
    background:var(--closed);opacity:.92;transition:background .5s ease}
  .row.open::before{background:var(--open);box-shadow:0 0 6px rgba(47,191,113,.25)}

  .top{display:flex;align-items:center;gap:.08em;min-width:0}
  .nm{flex:1 1 auto;min-width:0;font-size:.96em;font-weight:700;color:#FFFFFF;letter-spacing:-.025em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 출처 배지: 하이퍼리퀴드 xyz 마켓 표시 */
  .nm .tag{display:inline-block;margin-left:.32em;padding:.04em .26em .08em;border-radius:.24em;
    font-size:.6em;font-weight:800;letter-spacing:.05em;color:#8FB3D6;vertical-align:.16em;
    background:rgba(120,170,230,.14);border:1px solid rgba(120,170,230,.3)}
  .px{flex:0 0 auto;min-width:4.35em;text-align:right;font-size:1.16em;font-weight:800;color:#fff;
    font-variant-numeric:tabular-nums;letter-spacing:-.035em;line-height:1.08}
  .pct{flex:0 0 auto;min-width:3.3em;margin-left:.1em;text-align:right;font-size:1.3em;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1.05;color:var(--down)}
  .pct.up{color:var(--up)}
  .pct.flat{color:#A7AFB9}

  .bot{display:flex;align-items:baseline;justify-content:space-between;gap:.5em;min-width:0;margin-top:.16em}
  .ath{font-size:.7em;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.002em}
  .ath b{color:#B6BFC8;font-weight:700}
  .dc{flex:0 0 auto;font-size:.7em;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .dc.up{color:var(--up)}
  .dc.down{color:var(--down)}
  .row.newhigh .ath b{color:#FFC663}

  /* ── 3년 월별 추이 미니 그래프 (월별 상승=빨강 · 하락=파랑) ── */
  .spk{flex:0 0 auto;width:38px;height:18px;display:block;align-self:center;
    margin:0 .06em 0 .1em;overflow:visible;pointer-events:none}
  .spk svg{display:block;width:38px;height:18px}

  /* ── 행 드래그 순서 변경 (모바일 롱프레스 · PC 마우스) ── */
  #list{touch-action:pan-y pinch-zoom}            /* 평소엔 세로 스크롤·핀치 확대 허용, 드래그가 붙은 뒤에만 preventDefault */
  /* 핀치로 확대(줌인)한 동안에는 스와이프 삭제·순서 변경을 끄고 상하좌우 자유 패닝만 */
  body.zoomed #list,body.zoomed .row{touch-action:pan-x pan-y pinch-zoom}
  body.zoomed #list{overscroll-behavior:auto}     /* 목록 끝에서도 확대 화면 패닝이 이어지게 */
  .row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  @media (hover:hover){ .row{cursor:grab} }
  .row.ghost{transition:transform .17s cubic-bezier(.2,.7,.25,1),opacity .45s ease;will-change:transform}
  .row.dragging{
    z-index:6;cursor:grabbing;transition:none;will-change:transform;
    background:#232B35;border-radius:.4em;
    box-shadow:0 12px 28px rgba(0,0,0,.62),0 0 0 1px rgba(150,185,225,.55),0 0 26px rgba(120,170,230,.16);
  }
  .row.dragging::before{opacity:1}
  body.dragging{user-select:none;-webkit-user-select:none}

  /* ── 푸터 ── */
  footer{flex:0 0 auto;padding:.44em .4em 0;display:flex;flex-direction:column;gap:.28em}
  .mrow{display:flex;gap:.28em}
  .mkt{flex:1 1 0;display:flex;align-items:center;justify-content:center;gap:.3em;min-width:0;
    padding:.4em .3em;border-radius:.5em;border:1px solid var(--edge);background:#161C22;
    font-size:.6em;font-weight:700;color:#B9C1CA;letter-spacing:.01em;white-space:nowrap}
  .mkt i{flex:0 0 auto;width:.66em;height:.66em;border-radius:99px;background:var(--closed);
    box-shadow:0 0 0 .2em rgba(229,72,77,.14)}
  /* 장중 = 초록 동그라미 1초 주기 점멸 / 장마감 = 빨강 고정 */
  .mkt.open i{background:var(--open);box-shadow:0 0 0 .2em rgba(47,191,113,.16);
    animation:mktBlink 1s ease-in-out infinite}
  @keyframes mktBlink{
    0%,100%{opacity:1;box-shadow:0 0 0 .2em rgba(47,191,113,.20),0 0 6px rgba(47,191,113,.75)}
    50%{opacity:.26;box-shadow:0 0 0 .06em rgba(47,191,113,.05),0 0 1px rgba(47,191,113,.2)}
  }
  @media (prefers-reduced-motion: reduce){
    .mkt.open i{animation:none;box-shadow:0 0 0 .2em rgba(47,191,113,.2),0 0 5px rgba(47,191,113,.6)}
  }
  .mkt .flag{flex:0 0 auto;width:1.32em;height:.9em;display:block;border-radius:.11em;overflow:hidden;
    box-shadow:0 0 0 .5px rgba(255,255,255,.22);opacity:.96}
  .mkt b{font-weight:800;color:#C9D1DA;letter-spacing:0}
  .mkt .st{font-weight:800;color:var(--closed);white-space:nowrap}
  .mkt.open .st{color:#4ED493}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:.5em;
    font-size:.6em;color:var(--dim2);font-weight:700;padding:0 .12em}
  .frow > span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .src{font-variant-numeric:tabular-nums;opacity:.9;text-align:right}

  /* ── 헤더 우측 묶음 + 추가 버튼 ── */
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:.4em}
  .hright{display:flex;align-items:center;gap:.34em;flex:0 0 auto}
  .addbtn{all:unset;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    font-size:.58em;font-weight:800;letter-spacing:.01em;color:#CFE0F2;white-space:nowrap;
    padding:.5em .72em;border-radius:99px;border:1px solid rgba(124,160,220,.38);background:rgba(124,160,220,.14);line-height:1.25}
  .addbtn:active{background:rgba(124,160,220,.26)}

  /* ── 옆으로 밀어 삭제: 행 내용이 왼쪽으로 열리면 빨간 바탕+휴지통이 드러나다 ── */
  .row .rc{position:relative;z-index:1;transform:translateX(0);transition:transform .22s cubic-bezier(.2,.7,.25,1)}
  .row.swiping .rc{transition:none}
  .row .del{position:absolute;z-index:0;right:0;top:0;bottom:0;width:0;background:var(--closed);overflow:hidden;
    transition:width .22s cubic-bezier(.2,.7,.25,1)}
  .row.swiping .del{transition:none}
  .row .del svg{position:absolute;right:.78em;top:50%;transform:translateY(-50%);width:1.5em;height:1.5em;
    stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}

  /* ── 종목 추가 모달 ── */
  .ov{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(4,6,9,.7)}
  .ov.on{display:flex}
  .sheet{width:100%;max-height:86%;display:flex;flex-direction:column;min-height:0;
    background:#141A22;border:1px solid var(--edge);border-bottom:0;border-radius:1.1em 1.1em 0 0;
    padding:.9em .85em calc(.8em + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 44px rgba(0,0,0,.66)}
  .shh{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-bottom:.55em}
  .shh b{font-size:.9em;font-weight:800;color:#fff;letter-spacing:-.015em}
  .shh .x{all:unset;cursor:pointer;font-size:.62em;font-weight:700;color:var(--dim);padding:.45em .8em;border-radius:99px;border:1px solid var(--edge)}
  .tabs{display:flex;gap:.3em;margin-bottom:.6em}
  .tabs button{all:unset;cursor:pointer;flex:1 1 0;text-align:center;font-size:.6em;font-weight:800;color:var(--dim);
    padding:.62em .2em;border-radius:.5em;border:1px solid var(--edge);background:#171D24}
  .tabs button.on{color:#fff;background:rgba(124,160,220,.2);border-color:rgba(124,160,220,.46)}
  .pane{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:.42em}
  .pane.on{display:flex}
  .fld{width:100%;font-size:.68em;font-weight:700;color:#E8EDF3;background:#0F141A;
    border:1px solid var(--edge);border-radius:.5em;padding:.72em .8em;outline:none}
  .fld::placeholder{color:#5E6773;font-weight:600}
  .lst{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    border:1px solid var(--line);border-radius:.5em;background:#11161D}
  .it{display:flex;align-items:center;gap:.5em;padding:.6em .7em;border-bottom:1px solid var(--line)}
  .it:last-child{border-bottom:0}
  .it .nm2{flex:1 1 auto;min-width:0;font-size:.72em;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .sub2{display:block;font-size:.8em;font-weight:700;color:#7C8591;margin-top:.16em}
  .it .px2{flex:0 0 auto;font-size:.68em;font-weight:700;color:#B9C1CA;font-variant-numeric:tabular-nums;text-align:right}
  .it .go{all:unset;cursor:pointer;flex:0 0 auto;font-size:.6em;font-weight:800;color:#A8CBEC;
    padding:.5em .8em;border-radius:99px;border:1px solid rgba(124,160,220,.4);background:rgba(124,160,220,.16)}
  .it .go.off{color:#5E6773;border-color:rgba(255,255,255,.14);background:transparent;cursor:default}
  .empty{font-size:.64em;font-weight:700;color:#6A727C;padding:.9em .2em;text-align:center}
  .yadd{all:unset;cursor:pointer;text-align:center;font-size:.68em;font-weight:800;color:#DCE9F7;
    padding:.78em;border-radius:.55em;border:1px solid rgba(124,160,220,.42);background:rgba(124,160,220,.2)}
  .yadd:active{background:rgba(124,160,220,.32)}
  .msg{font-size:.62em;font-weight:700;color:#8B939D;min-height:1.3em;line-height:1.45}
  .msg.bad{color:#EF8A8C}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="tfb">
      <div class="tfs" id="tfs" role="group" aria-label="차트 봉 단위">
        <button type="button" data-tf="1mo" class="on" aria-pressed="true">월봉</button>
        <button type="button" data-tf="1wk" aria-pressed="false">주봉</button>
        <button type="button" data-tf="1d" aria-pressed="false">일봉</button>
      </div>
      <span class="tfh" id="tfh">최근 3년</span>
    </div>
    <div class="hrow">

  var HIST = HISTS["1mo"], histAt = 0, SPKC = {};
  function tfMeta(tf){ return TF_META[tf] || TF_META["1mo"]; }
  function histKey(tf){ return HIST_KEY + tf; }

  function histSym(a){ if(a.id==="csi300"||a.id==="tasi"||a.id==="k200") return null; return a.histSym || a.yahoo; }   // CSI300은 동방재부, TASI·코스피200 야간선물은 investing.com에서 채운다

  // Yahoo spark는 한 요청에 심볼을 **최대 20개**까지만 받는다(초과하면 400 Bad Request).
  // 28종이 된 지금은 21개라 20개씩 나눠 부르되, 환율 환산 쌍(SK하이닉스·KRW=X)은 같은 배치에 넣는다.
  function histBatches(){
    var seen = {}, batches = [], cur = [];
    function push(s){ if(!s || seen[s]) return; seen[s] = 1; cur.push(s); }
    var list = ASSETS.filter(function(a){ return a.fxSym; })
      .concat(ASSETS.filter(function(a){ return !a.fxSym; }));   // 쌍을 가진 행을 먼저
    list.forEach(function(a){
      var s = histSym(a);
      if(!s) return;
      if(a.fxSym && !seen[s]){
        if(cur.length >= 19){ batches.push(cur); cur = []; }   // 쌍이 갈라지지 않게 한 칸 먹여 둔다
        push(s); push(a.fxSym);
      }else push(s);
      if(cur.length >= 20){ batches.push(cur); cur = []; }
    });
    if(cur.length) batches.push(cur);
    return batches;
  }
  function histURL(syms, tf){
    var m = tfMeta(tf);
    return "https://query1.finance.yahoo.com/v8/finance/spark?symbols=" +
      encodeURIComponent(syms.join(",")) + "&range=" + m.range + "&interval=" + m.iv + "&_=" + Date.now();
  }

  // 히스토리는 프록시를 한 번에 하나씩만(부하 최소화) 시도
  var HROUTES = [
    {n:"jina",       f:function(u){ return "https://r.jina.ai/" + u; }, ms:9000},
    {n:"codetabs",   f:function(u){ return "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u); }, ms:7000},
    {n:"allorigins", f:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }, ms:7000},
    {n:"cors.lol",   f:function(u){ return "https://api.cors.lol/?url=" + encodeURIComponent(u); }, ms:7000},
    {n:"direct",     f:function(u){ return u; }, ms:6000}
  ];
  function histGet(u){
    var i = 0;
    function next(){
      if(i >= HROUTES.length) return Promise.reject(new Error("all hist routes failed"));
      var r = HROUTES[i++];
      return getText(r.f(u), r.ms).then(jsonLoose).catch(function(e){
        if(DBG) dg("h:" + r.n + " x");
        return next();
      });
    }
    return next();
  }

  // 봉 종가 → ((종가 - 3년내 최고점) / 최고점) * 100  (그래프의 0% 기준선과 같은 좌표)
  // 마지막 봉은 진행 중인 이번 달/주/일이라 현재가(10초 갱신)로 이어 그리므로 뺀다.
  function histSeries(a, closes){
    if(!(a.ath > 0)) return null;
    var v = [];
    for(var i=0;i<closes.length;i++){
      var c = closes[i];
      if(c==null || !isFinite(c) || c<=0) continue;
      v.push(Math.round((c - a.ath) / a.ath * 10000) / 100);
    }
    if(v.length > 3) v.pop();
    return v.length >= 2 ? v : null;
  }
  /* 환율 환산 행(xyz SK하이닉스 ← KRW=X): 봉 시각에 맞는 환율을 고른다.
     일봉·주봉은 두 심볼의 봉 개수가 달라(휴장일 차이) 순번으로 맞출 수 없으므로
     '그 봉 시각과 같거나 그 직전' 환율 종가를 이분 탐색으로 찾는다. */
  function fxAt(fts, fxs, t){
    var lo = 0, hi = fts.length - 1, at = -1, mid;
    while(lo <= hi){
      mid = (lo + hi) >> 1;
      if(Number(fts[mid]) <= t){ at = mid; lo = mid + 1; } else hi = mid - 1;
    }
    if(at < 0) return null;
    var f = fxs[at];
    return (f!=null && isFinite(f) && f > 0) ? f : null;
  }
  function histApply(d, tf){
    var map = HISTS[tf] || (HISTS[tf] = {}), n = 0;
    ASSETS.forEach(function(a){
      var s = histSym(a), node = s && d && d[s];
      if(!node) return;
      var closes = node.close || node.c || [];
      var ts = node.timestamp || node.t || [];
      if(a.fxSym){                     // 달러 표시 자산(하이퍼리퀴드 SK하이닉스): 봉별 원화 종가를 그 봉의 환율로 나눈 달러 계열
        var fnode = d[a.fxSym];
        var fxs = fnode && (fnode.close || fnode.c);
        var fts = fnode && (fnode.timestamp || fnode.t || []);
        if(!fxs || !fts.length) return;
        if(ts.length === closes.length){
          closes = closes.map(function(c, k){ var f = fxAt(fts, fxs, Number(ts[k])); return (c!=null && f) ? c/f : null; });
        }else if(fxs.length === closes.length){
          closes = closes.map(function(c, k){ return (c!=null && fxs[k]) ? c/fxs[k] : null; });
        }else return;
      }
      var v = histSeries(a, closes);
      if(v){ map[a.id] = v; n++; }
    });
    if(n){
      HISTS_T[tf] = Date.now(); histSave(tf);
      if(tf === TF){ redrawSparks(); tfUI(); }
      if(DBG) dg("hist " + tf + " " + n);
    }
    return n;
  }
  function histSave(tf){
    tf = tf || TF;
    try{ localStorage.setItem(histKey(tf), JSON.stringify({t:HISTS_T[tf] || 0, d:HISTS[tf] || {}})); }catch(e){}
  }
  function histRestore(tf){
    tf = tf || TF;
    try{
      var c = JSON.parse(localStorage.getItem(histKey(tf)) || "null");
      if(!c || !c.d) return;
      var map = HISTS[tf] || (HISTS[tf] = {});
      Object.keys(c.d).forEach(function(id){
        if(BY[id] && c.d[id] && c.d[id].length > 1) map[id] = c.d[id];
      });
      HISTS_T[tf] = c.t || 0;
    }catch(e){}
  }
  /* 한 봉만 새로 받았을 때: 그 봉 단위 캐시에 넣고, 지금 보고 있는 단위일 때만 다시 그린다 */
  function histStored(tf, id, v){
    HISTS[tf][id] = v; HISTS_T[tf] = Date.now(); histSave(tf);
    if(tf === TF){
      SPKC[id] = null;
      try{ drawSpark(BY[id], pctOf(BY[id], state[id] && state[id].px)); }catch(e){}
      tfUI();
    }
  }

  function loadHist(tf){
    tf = tf || TF;
    var map = HISTS[tf] || (HISTS[tf] = {});
    var miss = ASSETS.some(function(a){ return histSym(a) && !map[a.id]; });
    if(!miss && HISTS_T[tf] && (Date.now() - HISTS_T[tf]) < HIST_TTL) return;
    var batches = histBatches(), bi = 0, n = 0;
    function done(){
      if(!n){ if(DBG) dg("hist fail"); loadHistOne(tf); return; }
      var rest = ASSETS.some(function(a){ return histSym(a) && !a.fxSym && !map[a.id]; });
      if(rest) loadHistOne(tf);      // 못 받은 심볼은 하나씩 chart로 보충
    }
    function step(){
      if(bi >= batches.length) return done();
      var u = histURL(batches[bi++], tf);
      histGet(u).then(function(d){ n += histApply(d, tf); }, function(){
        if(DBG) dg("hist b" + bi + " fail");
      }).then(step);
    }
    step();
  }
  /* CSI 300: Yahoo `000300.SS`는 range=3y·interval=1mo에도 봉을 1개만 준다.
     동방재부(Eastmoney) 봉(klt 103=월·102=주·101=일)을 받아 최근 구간만 쓴다. */
  function loadHistCSI(tf){
    tf = tf || TF;
    if(!BY.csi300) return;
    var m = tfMeta(tf);
    var url = "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.000300" +
      "&fields1=f1,f2,f3&fields2=f51,f53&klt=" + m.emKlt + "&fqt=1&end=20500101&lmt=" + m.emLmt;
    histGet(url).then(function(d){
      var k = d && d.data && d.data.klines;
      if(!Array.isArray(k) || !k.length) throw new Error("no klines");
      var closes = k.map(function(s){ return parseFloat(String(s).split(",")[1]); }).slice(-m.keep);
      var v = histSeries(BY.csi300, closes);
      if(!v) throw new Error("no series");
      histStored(tf, "csi300", v);
      if(DBG) dg("hist em " + tf + " " + v.length);
    }).catch(function(){ if(DBG) dg("hist em fail"); });
  }
  /* 사우디 TASI: Yahoo ^TASI.SR은 range=3y·interval=1mo에도 봉을 1개만 준다(장중 시세만 유효).
     그래서 봉별 종가는 investing.com 히스토리 API에서 받는다. 이 API는 CORS를 열어 주지만
     `domain-id: www` 헤더가 없으면 403/챌린지(Just a moment)가 뜨므로 헤더를 붙여 직접 호출한다. */
  var INV_TASI = "https://api.investing.com/api/financialdata/historical/11319";   // 11319 = Tadawul All Share (TASI)
  function invDate(d){
    var m = d.getMonth()+1, dd = d.getDate();
    return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;
  }
  function invNum(s){
    var v = parseFloat(String(s==null ? "" : s).replace(/,/g,""));
    return isFinite(v) ? v : null;
  }
  function invGet(url, ms){
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, ms || 8000);
    return fetch(url, {signal:ctl.signal, cache:"no-store", mode:"cors", credentials:"omit",
        headers:{"domain-id":"www", "accept":"application/json"}})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.text(); })
      .then(function(t){ clearTimeout(timer); return jsonLoose(t); },
            function(e){ clearTimeout(timer); throw e; });
  }
  /* investing.com 히스토리: 봉 단위별 기간을 넉넉히 잡아 받은 뒤 최근 봉만 남긴다(내림차순 응답 → 뒤집어 오름차순) */
  function invHistRows(base, tf, ms){
    var m = tfMeta(tf), now = new Date();
    var from = new Date(now.getFullYear(), now.getMonth() - m.months, 1);
    var url = base + "?start-date=" + invDate(from) + "&end-date=" + invDate(now) +
              "&time-frame=" + m.invTF + "&add-missing-rows=false&_=" + Date.now();
    return invGet(url, ms || 9000).then(function(d){
      var rows = d && d.data;
      if(!Array.isArray(rows) || rows.length < 6) throw new Error("no rows");
      return rows.slice().reverse().map(function(r){
        return invNum(r.last_closeRaw!=null ? r.last_closeRaw : r.last_close);
      }).slice(-m.keep);
    });
  }
  var tasiHistTry = 0;
  function loadHistTASI(tf){
    tf = tf || TF;
    if(!BY.tasi) return;
    if(HISTS[tf].tasi && HISTS_T[tf] && (Date.now() - HISTS_T[tf]) < HIST_TTL) return;
    invHistRows(INV_TASI, tf).then(function(closes){
      var v = histSeries(BY.tasi, closes);
      if(!v) throw new Error("no series");
      histStored(tf, "tasi", v);
      if(DBG) dg("hist tasi " + tf + " " + v.length);
      tasiHistTry = 0;
    }).catch(function(e){
      if(DBG) dg("hist tasi fail:" + ((e&&e.message)||e));
      if(tf === TF && tasiHistTry++ < 2) setTimeout(function(){ loadHistTASI(tf); }, 15000);
    });
  }
  /* Yahoo가 TASI를 90초 넘게 못 줄 때: investing.com 일별 종가로 현재가·전일 대비를 대신한다 */
  function tasiInvesting(){
    var now = new Date();
    var from = new Date(now.getTime() - 14*86400000);
    return invGet(INV_TASI + "?start-date=" + invDate(from) + "&end-date=" + invDate(now) +
                  "&time-frame=Daily&add-missing-rows=false&_=" + Date.now(), 7000)
      .then(function(d){
        var rows = d && d.data;
        if(!Array.isArray(rows) || !rows.length) throw new Error("no tasi rows");
        var px = invNum(rows[0].last_closeRaw!=null ? rows[0].last_closeRaw : rows[0].last_close);
        if(px==null || px<=0) throw new Error("bad tasi px");
        var prev = rows[1] ? invNum(rows[1].last_closeRaw!=null ? rows[1].last_closeRaw : rows[1].last_close) : null;
        state.tasi = {px:px, chg:(prev ? (px-prev)/prev*100 : null), t:Date.now()};
        srcTag.sa = "investing.com";
        return 1;
      });
  }

  /* 코스피200 야간선물: Yahoo에 선물 심볼이 없어 investing.com 히스토리(최근월물 연속 8987)로 봉을 채운다.
     3년내 최고점(1,535.00)도 같은 API의 일별 고가 최대값(747거래일, 2026-06-18)에서 확정했다. */
  var INV_K200 = "https://api.investing.com/api/financialdata/historical/8987";
  var k200HistTry = 0;
  function loadHistK200(tf){
    tf = tf || TF;
    if(!BY.k200) return;
    if(HISTS[tf].k200 && HISTS_T[tf] && (Date.now() - HISTS_T[tf]) < HIST_TTL) return;
    invHistRows(INV_K200, tf).then(function(closes){
      var v = histSeries(BY.k200, closes);
      if(!v) throw new Error("no series");
      histStored(tf, "k200", v);
      if(DBG) dg("hist k200 " + tf + " " + v.length);
      k200HistTry = 0;
    }).catch(function(e){
      if(DBG) dg("hist k200 fail:" + ((e&&e.message)||e));
      if(tf === TF && k200HistTry++ < 2) setTimeout(function(){ loadHistK200(tf); }, 15000);
    });
  }
  var histOnePass = {"1mo":0, "1wk":0, "1d":0};
  function loadHistOne(tf){
    tf = tf || TF;
    var m = tfMeta(tf), map = HISTS[tf] || (HISTS[tf] = {});
    var list = ASSETS.filter(function(a){ return histSym(a) && !a.fxSym && !map[a.id]; });   // 환율 환산 행은 단일 심볼 폴백에서 뺀다
    var i = 0, bad = 0, ended = false;
    function finish(){
      if(ended) return; ended = true;
      HISTS_T[tf] = HISTS_T[tf] || Date.now(); histSave(tf);
      // 한 번 쓰러진 심볼(프록시 응답 실패)이 그래프에서 빠진 채 남지 않게 20초 뒤 두 번까지만 다시 시도한다
      if(histOnePass[tf] < 2){
        var left = ASSETS.some(function(a){ return histSym(a) && !map[a.id]; });
        if(left){
          histOnePass[tf]++;
          if(DBG) dg("hist retry " + tf + " " + histOnePass[tf]);
          setTimeout(function(){ loadHistOne(tf); }, 20000);
        }else histOnePass[tf] = 0;
      }
    }
    function step(){
      if(i >= list.length || bad >= 2) return finish();
      var a = list[i++];
      var u = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(histSym(a)) +
        "?range=" + m.range + "&interval=" + m.iv + "&_=" + Date.now();
      histGet(u).then(function(d){
        var r = d && d.chart && d.chart.result && d.chart.result[0];
        var q = r && r.indicators && r.indicators.quote && r.indicators.quote[0];
        var v = histSeries(a, (q && q.close) || []);
        if(!v) throw new Error("no series");
        map[a.id] = v; bad = 0; histOnePass[tf] = 0; HISTS_T[tf] = Date.now(); histSave(tf);
        if(tf === TF){ SPKC[a.id] = null; redrawSparks(); tfUI(); }
      }).catch(function(){ bad++; }).then(function(){
        if(i >= list.length || bad >= 2) return finish();
        setTimeout(step, 250);
      });
    }
    step();
  }
  /* 지금 보고 있는 봉 단위의 히스토리를 빠짐없이 채운다 */
  function loadHistFor(tf){
    tf = tf || TF;
    loadHist(tf);
    loadHistCSI(tf);
    loadHistTASI(tf);
    loadHistK200(tf);
    custom.forEach(function(c, k){
      if(c.hl && !HISTS[tf][c.id]) setTimeout(function(){ loadHLHist(c, tf); }, k*250);
    });
  }

  /* ── 봉 단위 버튼(월봉·주봉·일봉) ── */
  function tfUI(){
    var box = document.getElementById("tfs");
    if(box){
      var bs = box.querySelectorAll("button[data-tf]");
      for(var i=0;i<bs.length;i++){
        var on = bs[i].getAttribute("data-tf") === TF;
        bs[i].classList.toggle("on", on);
        bs[i].setAttribute("aria-pressed", on ? "true" : "false");
      }
    }
    var h = document.getElementById("tfh");
    if(h){
      var n = 0, map = HISTS[TF] || {};
      ORDER.some(function(id){ var v = map[id]; if(v && v.length > 1){ n = v.length; return true; } return false; });
      h.textContent = tfMeta(TF).hint + (n ? " · " + n + "봉" : " · " + tfMeta(TF).label);
    }
  }
  function setTF(tf){
    if(!TF_META[tf] || tf === TF) return;
    TF = tf;
    try{ localStorage.setItem(TF_KEY, tf); }catch(e){}
    HIST = HISTS[tf];                        // 그 봉 단위 캐시로 갈아탄다
    histAt = HISTS_T[tf] || 0;
    SPKC = {};                               // 캐시가 없던 봉은 이 자리에서 다시 그린다
    ORDER.forEach(function(id){ try{ drawSpark(BY[id], pctOf(BY[id], state[id] && state[id].px)); }catch(e){} });
    tfUI();
    loadHistFor(tf);
  }

  function sparkDomain(v){
    var mn = 0, mx = 0;
    for(var i=0;i<v.length;i++){ if(v[i] < mn) mn = v[i]; if(v[i] > mx) mx = v[i]; }
    var hi = Math.max(0, mx), lo = Math.min(0, mn), span = hi - lo;
    if(span < 10){ lo = hi - 10; span = 10; }     // 변동이 작아도 노이즈가 증폭되지 않게
    var padT = span*0.10, padB = span*0.08;
    return {top:hi+padT, total:span+padT+padB};
  }

  function pctOf(a, px){
    if(px==null || !isFinite(px)) return null;
    return (Number(px) - a.ath) / a.ath * 100;
  }
  function redrawSparks(){
    ORDER.forEach(function(id){ drawSpark(BY[id], pctOf(BY[id], state[id] && state[id].px)); });
  }

  /* 미니 그래프: 3년 월별 흐름. 전월 대비 오른 구간 = 빨강, 내린 구간 = 파랑.
     마지막 구간(직전 월 → 현재가)도 같은 규칙으로 색이 바뀐다. */
  function drawSpark(a, live){
    var box = document.getElementById("spk-" + a.id);
    if(!box) return;
    var v = HIST[a.id];
    if(!v || v.length < 2){
      var c0 = SPKC[a.id];
      if(!c0 || !c0.empty){
        box.innerHTML = "";          // 히스토리가 없으면 빈 자리로 둔다(수치 표시는 그대로)
        SPKC[a.id] = {empty:true};
      }
      return;
    }
    var c = SPKC[a.id];
    if(!c || c.arr !== v || c.empty){
      var dm = sparkDomain(v), inner = SPK_H - 2*SPK_PAD;
      var yf = function(val){
        var yy = SPK_PAD + (dm.top - val)/dm.total*inner;
        return Math.max(1, Math.min(SPK_H-1, yy));
      };
      var n = v.length, step = (SPK_W - 3.4)/n, i;
      var lw = n > 44 ? 0.95 : 1.25;        // 일봉·주봉처럼 봉이 많으면 선을 가늘게(몽개짐 방지)
      var xf = function(k){ return (1.2 + k*step); };
      var segs = "";
      for(i=1;i<n;i++){
        var rise = v[i] >= v[i-1];
        segs += '<line x1="'+xf(i-1).toFixed(2)+'" y1="'+yf(v[i-1]).toFixed(2)+'" x2="'+xf(i).toFixed(2)+'" y2="'+yf(v[i]).toFixed(2)+
                '" stroke="'+(rise?UP:DOWN)+'" stroke-width="'+lw+'" stroke-linecap="round"/>';
      }
      var y0 = yf(0);
      box.innerHTML =
        '<svg viewBox="0 0 ' + SPK_W + ' ' + SPK_H + '" aria-hidden="true">' +

  /* ───────── 행 순서 변경: 모바일 롱프레스 · PC 마우스 드래그 + 저장 ─────────
     - 터치: 450ms 길게 누르면 드래그가 붙고(15ms 진동 + 들뜬 그림자/테두리), 그 뒤 위아래로 끌면 실시간으로 자리를 바꾼다.
       450ms 안에 4px 넘게 움직이면 '종목을 찾아 훑어보는 손짓'으로 보고 즉시 드래그를 포기한다.
     - 마우스: 누른 뒤 8px 이상 움직이면 드래그 시작(user-select:none으로 텍스트 선택 방지).
     - 확대(핀치 줌인) 중이거나 핀치 직후에는 순서 변경·스와이프 삭제를 시작조차 하지 않고,
       이미 시작된 제스처도 절대 커밋하지 않는다(placeAt·flushSettle·delAsset에서도 다시 막는다).
     - 핸들 열을 두지 않고 행 자체를 잡으므로 기존 4열 구조(이름·미니그래프·가격·변동률)는 그대로다.
     - 순서는 localStorage(assetMonitor.order.v1)에 저장해 새로고침·재방문·10초 자동 갱신에도 유지한다. */
  var ORD_KEY = "assetMonitor.order.v1";    // BASE_ORDER는 applyAssets()가 채운다
  var closeSwipeOpen = function(){};       // wireDrag가 실제 구현을 넣는다
  var HOLD_MS = 450, TOUCH_SLOP = 4, MOUSE_SLOP = 8;   // 롱프레스 대기(ms) / 터치·마우스 허용 오차(px)

  /* ── 확대(핀치 줌인) 판별 ──────────────────────────────────────────────
     안드로이드 크롬·WebView 는 핀치 중 visualViewport.scale 갱신이 조금 늦거나
     이벤트를 빠뜨릴 때가 있어 한 신호만 믿지 않는다. 아래 중 하나라도 걸리면 '확대 중':
       ① visualViewport.scale > 1.01
       ② documentElement.clientWidth / innerWidth > 1.01   (레이아웃 폭이 줄어든 확대)
       ③ visualViewport.offsetLeft/offsetTop > 1            (확대 후 화면을 옮긴 상태)
       ④ visualViewport.width < clientWidth - 2             (보이는 폭이 좁아진 확대)
     여기에 이번 제스처에서 관측된 최대 배율(peakZoom)과 핀치 여부(pinchSeen)까지 더해
     이벤트가 늦게 오거나 빠져도 '확대였다'는 사실을 놓치지 않는다. */
  var ZOOM_MIN = 1.01, PINCH_LOCK_MS = 400;
  var peakZoom = 1;          // 이번 제스처에서 관측된 최대 배율
  var pinchSeen = false;     // 이번 제스처에서 두 손가락이 한 번이라도 닿았는가
  var gestureLockUntil = 0;  // 이 시각까지 롱프레스·스와이프 진입 금지(핀치 뒤 남은 손가락 방어)
  function rawScale(){
    var vv = window.visualViewport;
    return (vv && typeof vv.scale === "number" && vv.scale > 0) ? vv.scale : 1;
  }
  function isZoomed(){
    if(window.__amZoom != null) return !!window.__amZoom;      // 실측 검증용 강제 플래그
    var vv = window.visualViewport, de = document.documentElement;
    var cw = de.clientWidth || 0, iw = window.innerWidth || 0;
    if(vv){
      if(typeof vv.scale === "number" && vv.scale > ZOOM_MIN) return true;
      if((vv.offsetLeft || 0) > 1 || (vv.offsetTop || 0) > 1) return true;
      if(cw && vv.width > 0 && vv.width < cw - 2) return true;
    }
    if(cw && iw && (cw / iw) > ZOOM_MIN) return true;
    return false;
  }
  /* 이번 제스처를 이어가면 안 되는 상태인가(확대 중 · 핀치 직후 · 핀치였던 제스처) */
  function gestureBlocked(){
    return pinchSeen || isZoomed() || peakZoom > ZOOM_MIN || Date.now() < gestureLockUntil;
  }
  /* 순서 저장·삭제처럼 되돌리기 어려운 쓰기 직전의 최종 관문 */
  function zoomWriteBlocked(){
    return isZoomed() || peakZoom > ZOOM_MIN;
  }
  var drag = null, settleT = 0, settleEl = null, settleTo = 0;
  var lp = {el:null, t:0, y0:0, x0:0};     // 롱프레스 대기 상태
  function cancelLp(){ if(lp.t){ clearTimeout(lp.t); lp.t = 0; } lp.el = null; }
  function beginPinch(){ pinchSeen = true; gestureLockUntil = Date.now() + PINCH_LOCK_MS; }

  function ordSave(){
    try{
      if(ORDER.join(",") === BASE_ORDER.join(",")) localStorage.removeItem(ORD_KEY);
      else localStorage.setItem(ORD_KEY, JSON.stringify(ORDER));
    }catch(e){}
  }
  /* 저장된 순서를 되살린다. 저장 이후 새로 추가된 자산은 기본 순서의 앞뒤 이웃 사이로 자연스럽게 합류시킨다. */
  function ordRestore(){
    var saved = null;
    try{ saved = JSON.parse(localStorage.getItem(ORD_KEY) || "null"); }catch(e){}
    if(!Array.isArray(saved) || !saved.length) return;
    var out = [], seen = {};
    saved.forEach(function(id){
      if(typeof id === "string" && BY[id] && !seen[id]){ out.push(id); seen[id] = 1; }
    });
    if(!out.length) return;
    // 이번에 새로 추가된 자산(APPEND_IDS)은 기존 순서와 상관없이 항상 맨 아래에 붙인다
    APPEND_IDS.forEach(function(id){
      if(BY[id] && !seen[id]){ out.push(id); seen[id] = 1; }
    });
    BASE_ORDER.forEach(function(id, i){
      if(seen[id]) return;
      var at = -1, k;
      for(k = i-1; k >= 0; k--){                        // 앞쪽 이웃 바로 뒤
        if(seen[BASE_ORDER[k]]){ at = out.indexOf(BASE_ORDER[k]) + 1; break; }
      }
      if(at < 0){
        for(k = i+1; k < BASE_ORDER.length; k++){        // 앞쪽 이웃이 없으면 뒤쪽 이웃 바로 앞
          if(seen[BASE_ORDER[k]]){ at = out.indexOf(BASE_ORDER[k]); break; }
        }
      }
      if(at < 0 || at > out.length) at = out.length;
      out.splice(at, 0, id); seen[id] = 1;
    });
    ORDER = out;
  }

    if(BY[id].custom) custom = custom.filter(function(c){ return c.id !== id; });
    else deleted[id] = 1;

  function restoreDefault(id){
    if(!deleted[id]) return;
    var idx = -1;
    DEFAULTS.forEach(function(d, i){ if(d.id === id) idx = i; });
    var after = null;
    for(var k = idx-1; k >= 0; k--){ if(BY[DEFAULTS[k].id]){ after = DEFAULTS[k].id; break; } }
    delete deleted[id];
    var list = ORDER.slice();
    var at = after ? list.indexOf(after) + 1 : 0;
    if(at < 0) at = list.length;
    list.splice(at, 0, id);
    ORDER = list;
    savePrefs();
    rebuild();
  }

  function pad2(n){ return (n<10?"0":"")+n; }

    var disp = hlDisp(sym);
    var def = {id:"h:"+disp, custom:true, name:disp, tag:"xyz", mkt:"xyz", hl:sym,
               ath:0, athDate:"", dec:2, cur:"$", chgLabel:"24h"};
    custom.push(def);

  function loadHLMeta(a){
    var end = Date.now(), start = end - 3*365*86400000;
    function body(iv){ return JSON.stringify({type:"candleSnapshot", req:{coin:a.hl, interval:iv, startTime:start, endTime:end}}); }
    postText(HL_URL, body("1d"), 15000).then(function(t){
      var d = JSON.parse(t);
      if(!Array.isArray(d) || !d.length) throw new Error("no candles");
      var best = 0, bt = 0;
      d.forEach(function(c){ var h = Number(c.h); if(isFinite(h) && h > best){ best = h; bt = Number(c.t); } });
      if(!(best > 0)) throw new Error("bad candles");
      a.ath = best; a.athDate = ymd2(bt/1000) + " 장중";
      savePrefs(); renderAll();
      loadHLHist(a, TF);            // 지금 보고 있는 봉 단위로 미니 그래프를 채운다
      return 1;
    }).catch(function(e){ if(DBG) dg("hlmeta:"+((e&&e.message)||e)); });
  }
  /* 사용자가 추가한 하이퍼리퀴드 xyz 종목의 봉별 히스토리(1M=월봉 · 1w=주봉 · 1d=일봉) */
  function loadHLHist(a, tf){

    setInterval(syncZoom, 250);                     // scale 갱신이 늦는 기기용 감시(가벼움)

    closeSwipeOpen = swClose;      // 다른 곳(모달·삭제 후 재구축)에서도 닫을 수 있게
  })();

  /* ───────── 갱신 ───────── */
  function race(p, ms){
    return new Promise(function(resolve, reject){
      var done = false;
      var t = setTimeout(function(){ if(!done){ done = true; reject(new Error("timeout")); } }, ms);
      p.then(function(v){ if(!done){ done = true; clearTimeout(t); resolve(v); } },
             function(e){ if(!done){ done = true; clearTimeout(t); reject(e); } });
    });
  }

  function cache(){
    try{
      var keep = {};
      ORDER.forEach(function(id){ if(state[id] && state[id].px!=null) keep[id] = state[id]; });
      var ks = {};
      ORDER.forEach(function(id){ if(STK[id] && STK[id].px!=null) ks[id] = STK[id]; });
      localStorage.setItem("apm.v2", JSON.stringify({t:Date.now(), s:keep, k:ks}));
    }catch(e){}
  }

  var busyAt = 0;
  function refresh(){
    if(busy && Date.now() - busyAt < 45000) return;   // 45초 넘게 멈춘 갱신은 버리고 새로 시작
    busy = true; busyAt = Date.now();
    var krNow = krLiveNow();        // 장중이면 삼성전자·SK하이닉스는 네이버 현재가, 마감이면 KOSPILAB 예상가
    var res = {idx:0, coin:0, kp:0, kr:0, stk:0, asia:0, sa:0, k200:0, xyz:0};

    var tasks = [
      race(getIndices(), 14000).then(function(n){ res.idx = n; }).catch(function(){ res.idx = 0; }),
      race(getKorea(), 13000).then(function(n){ res.kr = n; }).catch(function(){ res.kr = 0; }),
      race(getAsia(), 13000).then(function(n){ res.asia = n; }).catch(function(){ res.asia = 0; }),
      race(getCrypto(), 14000).then(function(n){ res.coin = n; }).catch(function(){ res.coin = 0; }),
      race(getXyz(), 9000).then(function(n){ res.xyz = n; }).catch(function(){ res.xyz = 0; })
    ];
    if(krNow){
      tasks.push(race(getStocks(), 13000).then(function(n){ res.stk = n; }).catch(function(){ res.stk = 0; }));
    }else{
      tasks.push(race(kospilab(), 20000).then(function(n){ res.kp = n; }).catch(function(){ res.kp = 0; }));
    }
    // 코스피200 야간선물: 프록시(jina) 부담을 줄이려 25초 간격으로만 받는다(가격은 화면에서 계속 재렌더)
    if(!state.k200 || (Date.now() - (state.k200.t||0)) > 25000){
      tasks.push(race(getK200(), 11000).then(function(n){ res.k200 = n; }).catch(function(){ res.k200 = 0; }));
    }
    // 사우디 TASI: Yahoo(YSYMS에 포함)가 90초 넘게 값을 못 주면 investing.com 종가로 대신 채운다
    if(!state.tasi || (Date.now() - (state.tasi.t||0)) > 90000){
      tasks.push(race(tasiInvesting(), 9000).then(function(n){ res.sa = n; }).catch(function(){ res.sa = 0; }));
    }

    Promise.all(tasks).then(function(){
      renderAll();
      var okI = res.idx > 0, okC = res.coin > 0, okR = res.kr > 0, okA = res.asia > 0, okX = res.xyz > 0;
      var okStock = (krNow ? res.stk : res.kp) > 0;
      var bits = [];
      if(okI) bits.push("Yahoo Finance");
      if(okA) bits.push(srcTag.asia || "해외지수");
      if(okR) bits.push(srcTag.kr || "네이버 증권");
      if(!krNow && res.kp > 0) bits.push("KOSPILAB");
      if(res.stk > 0 && krPhaseNow() === "pre") bits.push("NXT 프리");
      if(res.stk > 0 && krPhaseNow() === "after") bits.push("NXT 애프터");
      if(res.sa > 0) bits.push(srcTag.sa || "investing.com");
      if(res.k200 > 0) bits.push(srcTag.k200 || "PreKOSPI");
      if(okX) bits.push(srcTag.xyz || "Hyperliquid");
      if(okC) bits.push(srcTag.coin || "CoinGecko");
      $("#src").textContent = bits.length ? bits.join(" · ") : "—";
      $("#src2").textContent = bits.length ? bits.join(" · ") : "—";

      var live = $("#live");
      if(okI && okC && okR && okA && okStock && okX){
        live.className = "live"; live.textContent = "LIVE";
        setStatus("ok", "마지막 업데이트 " + kstTime());
      }else if(okI || okC || okR || okA || okStock || okX){
        live.className = "live"; live.textContent = "LIVE";
        var miss = [];
        if(!okI) miss.push("지수");
        if(!okR) miss.push("한국지수");
        if(!okA) miss.push("닛케이·CSI");
        if(!okStock) miss.push(krNow ? "한국현재가" : "예상가");
        if(!okX) miss.push("하이퍼리퀴드");
        if(!okC) miss.push("코인");
        setStatus("warn", kstTime() + " 일부 지연 · " + miss.join("·"));
      }else{
        live.className = "live off"; live.textContent = "OFF";
        setStatus("", "연결 실패 · 10초 후 재시도");
      }
      if(DBG) $("#stxt").textContent += "  " + diag.join("  ");
    }).catch(function(){
      setStatus("", "표시 오류 · 10초 후 재시도");
    }).then(function(){
      busy = false;
      nextAt = Date.now() + CYCLE;
      cache();
    });
  }

  function restore(){
    try{
      var c = JSON.parse(localStorage.getItem("apm.v2")||"null");
      if(!c || !c.s) return;
      var any = false;
      ORDER.forEach(function(id){ if(c.s[id] && BY[id]){ state[id] = c.s[id]; any = true; } });
      if(c.k) ORDER.forEach(function(id){ if(c.k[id] && BY[id]) STK[id] = c.k[id]; });
      if(any){ renderAll(); setStatus("warn", "저장된 값 표시 · 갱신 중"); }
    }catch(e){}
  }

  /* ───────── 1초 카운트다운 + 장 상태 전환 ───────── */
  var lastSec = -1;
  function tick(){
    var left = Math.max(0, nextAt - Date.now());
    $("#prog").style.transform = "scaleX(" + (left/CYCLE).toFixed(3) + ")";
    var sec = Math.ceil(left/1000);
    if(sec !== lastSec){
      lastSec = sec;
      $("#clock").textContent = kstTime();
      $("#cd").textContent = "10초마다 자동 갱신 · " + sec + "s";
      computeMarkets();
      renderMarket();
      ORDER.forEach(function(id){ renderRow(BY[id]); });   // 장중/마감 색 자동 전환
    }
    if(left <= 0 && !busy) refresh();
  }
  setInterval(tick, 100);

  $("#refresh").addEventListener("click", function(){
    nextAt = Date.now() + CYCLE;
    if(!busy) refresh();
  });
  /* 봉 단위 버튼: 월봉 · 주봉 · 일봉 */
  (function wireTF(){
    var box = document.getElementById("tfs");
    if(!box) return;
    box.addEventListener("click", function(e){
      var t = e.target, b = (t && t.closest) ? t.closest("button[data-tf]") : null;
      if(!b) return;
      var tf = b.getAttribute("data-tf");
      if(tf === TF) return;
      try{ if(navigator.vibrate) navigator.vibrate(8); }catch(err){}
      setTF(tf);
    });
  })();
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible"){ nextAt = Date.now() + 200; tick(); }
  });

  /* ───────── 시작 ───────── */
  loadPrefs();                     // 삭제한 종목 · 사용자가 추가한 종목
  applyAssets();
  ORDER = ASSETS.map(function(a){ return a.id; });
  computeMarkets();
  try{ var _tf = localStorage.getItem(TF_KEY); if(_tf && TF_META[_tf]) TF = _tf; }catch(e){}   // 마지막에 고른 봉 단위
  HIST = HISTS[TF];
  histRestore(TF);                 // 그 봉 단위의 저장된 히스토리 캐시를 먼저
  histAt = HISTS_T[TF] || 0;
  tfUI();
  ordRestore();                    // 저장된 사용자 순서가 있으면 먼저 되살리고 그 순서로 그린다
  buildList();
  ordSetUI();
  $("#cnt").textContent = ASSETS.length;
  restore();
  $("#clock").textContent = kstTime();
  renderMarket();
  refresh();
  setTimeout(function(){ loadHistFor(TF); }, 600);   // 봉 단위 히스토리는 첫 실시간 조회 뒤 백그라운드로 1회
  // 사용자가 추가한 하이퍼리퀴드 xyz 종목: 히스토리·최고점을 다시 채운다(캐시가 없거나 상장후 고점이 비었을 때)
  custom.forEach(function(c, k){
    if(c.hl && (!(c.ath > 0) || !HISTS[TF][c.id])) setTimeout(function(){ loadHLMeta(c); }, 2200 + k*300);
  });

  /* ───────── 종목 추가 모달 배선 ───────── */
  (function wireModal(){
    var addBtn = document.getElementById("addbtn");
    if(addBtn) addBtn.addEventListener("click", openModal);
    if(!ovEl) return;
    ovEl.addEventListener("click", function(e){
      var t = e.target;
      if(t === ovEl){ closeModal(); return; }
      var b = t && t.closest ? t.closest("button") : null;
      if(b){
        if(b.id === "ovx"){ closeModal(); return; }
        if(b.getAttribute("data-tab")){ setTab(b.getAttribute("data-tab")); return; }
        if(b.getAttribute("data-back")){ restoreDefault(b.getAttribute("data-back")); renderBackList(); return; }
        if(b.getAttribute("data-hl")){ addHL(b.getAttribute("data-hl")+""); return; }
        if(b.id === "yadd"){ addYahooTicker(); return; }
      }
    });
    var hq = document.getElementById("hlq");
    if(hq) hq.addEventListener("input", renderHLList);
    var yy = document.getElementById("yq");
    if(yy) yy.addEventListener("keydown", function(e){ if(e.key === "Enter") addYahooTicker(); });
  })();
  setInterval(function(){ if(!busy) renderAll(); }, 30000);

  /* ───────── 화면 꽉 채우기 (9:16 비율 유지) ───────── */
  function fit(){
    var app = $("#app");
    var s = Math.min(app.clientWidth/390, app.clientHeight/700);   // 세로는 스크롤하므로 폭을 기준으로 키운다
    s = Math.max(0.58, Math.min(1.30, s));
    app.style.fontSize = (16*s).toFixed(2) + "px";
  }
  window.addEventListener("resize", fit);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();
  setTimeout(fit, 300);
})();
</script>
